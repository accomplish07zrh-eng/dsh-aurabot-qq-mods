name: Release

on:
  push:
    branches: [main]
    paths: ['modules/**', 'revoked.json']
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  # 这一步会执行模块代码，所以只给只读权限；发布放在单独的 job 里
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: node scripts/pack.mjs --out dist --missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.[] | [.tag, .file, .sha256] | @tsv' dist/release.json | while IFS=$'\t' read -r tag file sha; do
            gh release view "$tag" > /dev/null 2>&1 && continue
            gh release create "$tag" "dist/$file" --target "$GITHUB_SHA" --title "$tag" --notes "sha256: $sha"
          done
      - name: 更新索引
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/push-registry.sh dist/release.json
