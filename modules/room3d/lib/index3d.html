<!doctype html>
<html lang="zh-CN">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#151a22;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  canvas{display:block}

    background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(8,12,18,.5) 100%)}

{ "imports": { "three": "/aurabot/api/ext/room3d/vendor/three.module.js" } }

<script type="module">
const errBox = document.getElementById('err');
const fail = (e) => { errBox.style.display = 'grid'; errBox.textContent = '页面出错：\n' + (e && e.message ? e.message : e) + '\n' + ((e && e.stack) || ''); };
window.addEventListener('error', (ev) => fail(ev.error || ev.message));
window.addEventListener('unhandledrejection', (ev) => fail(ev.reason));

const THREE = await import('three');
const { RoundedBoxGeometry } = await import('/aurabot/api/ext/room3d/vendor/RoundedBoxGeometry.js');
const { OrbitControls } = await import('/aurabot/api/ext/room3d/vendor/OrbitControls.js');

/* ===== 平面图坐标（米）===== */
const ROOMS = [
  { name: '卧室C', x1: 0.9, z1: 0.0, x2: 4.0, z2: 2.65, tint: '#dcc2a6' },
  { name: '卫生间B', x1: 0.9, z1: 2.65, x2: 2.35, z2: 4.55, tint: '#c9cfd6' },
  { name: '卫生间A', x1: 0.1, z1: 4.55, x2: 2.35, z2: 7.35, tint: '#c9cfd6' },
  { name: '卧室B', x1: 0.1, z1: 7.35, x2: 4.0, z2: 11.45, tint: '#dec4a8' },
  { name: '卧室D', x1: 4.0, z1: 1.4, x2: 7.0, z2: 4.45, tint: '#dcc2a6' },
  { name: '卧室A', x1: 4.0, z1: 5.6, x2: 7.0, z2: 10.45, tint: '#dec4a8' },
  { name: '厨房', x1: 7.0, z1: 0.2, x2: 10.3, z2: 2.1, tint: '#d3b696' },
  { name: '客厅', x1: 7.0, z1: 2.1, x2: 12.0, z2: 10.45, tint: '#d9bfa2' },
  { name: '阳台', x1: 7.0, z1: 10.45, x2: 10.45, z2: 12.0, tint: '#cfd5db' },
  { name: '走廊', x1: 4.0, z1: 4.45, x2: 7.0, z2: 5.6, tint: '#d7bd9f' },
  { name: '玄关', x1: 4.0, z1: 10.45, x2: 7.0, z2: 11.45, tint: '#d7bd9f' },
];
const OUTLINE = [
  [0.1, 0.0], [12.0, 0.0], [12.0, 12.0], [0.1, 12.0],
];
const OUTER = [
  // 北墙（z=0）、西墙（x=0.1）已删除，只留东面（海景窗）和南面
  [12.0, 0.0, 12.0, 12.0],
  [12.0, 12.0, 0.1, 12.0],
];
const LOW = [];
const INNER = [
  [0.9, 2.65, 2.4, 2.65], [3.2, 2.65, 4.0, 2.65],
  [0.9, 4.55, 1.4, 4.55], [2.2, 4.55, 2.35, 4.55],
  [2.35, 4.55, 2.35, 5.4], [2.35, 6.2, 2.35, 7.35],
  [0.1, 7.35, 1.3, 7.35], [2.1, 7.35, 4.0, 7.35],
  [4.0, 1.4, 4.0, 2.2], [4.0, 3.0, 4.0, 4.45],
  [4.0, 4.45, 5.2, 4.45], [6.0, 4.45, 7.0, 4.45],
  [4.0, 5.6, 5.6, 5.6], [6.4, 5.6, 7.0, 5.6],
  [4.0, 5.6, 4.0, 8.2], [4.0, 9.1, 4.0, 10.45],
  [4.0, 10.45, 5.2, 10.45], [6.0, 10.45, 7.0, 10.45],
  [7.0, 2.1, 8.0, 2.1], [9.0, 2.1, 10.3, 2.1],
  [7.0, 0.2, 7.0, 2.1],
  [7.0, 10.45, 7.5, 10.45], [10.0, 10.45, 10.45, 10.45],
  [7.0, 2.1, 7.0, 3.0], [7.0, 3.9, 7.0, 4.45],
  [7.0, 5.6, 7.0, 7.0], [7.0, 7.9, 7.0, 10.45],
];
const WALL_H = 2.55, WALL_T = 0.13, CHAR_H = 1.6;

/* ===== 渲染器 ===== */
// PC 浏览器（有精确指针、没有触摸）默认省电模式，可用 ?perf=high 强制全画质
const PC_MODE = (() => {
  const q = location.search;
  if (q.includes('perf=low')) return true;
  if (q.includes('perf=high')) return false;
  return matchMedia('(pointer: fine)').matches && !('ontouchstart' in window);
})();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, PC_MODE ? 1.25 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#151a22');

const aspect0 = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-8 * aspect0, 8 * aspect0, 8, -8, 0.1, 400);
camera.position.set(-7.2, 16.2, -7.2);
camera.lookAt(6.0, 0.8, 6.0);

// 取景：直接按投影尺寸估算，保证横屏填满、竖屏不裁
let zoomFactor = 1;   // 1 = 默认取景；滚轮改它，但不写入机位记忆
function fitView() {
  const a = innerWidth / innerHeight;
  const v = Math.max(10.6, 22.5 / Math.max(a, 0.2)) * zoomFactor;
  camera.left = -v * a / 2; camera.right = v * a / 2;
  camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix();
}
fitView();

// 鼠标/手指拖拽 360° 旋转（只转不改距离，转完自动重新取景）
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6.0, 0.8, 6.0);
controls.enableZoom = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.75;
renderer.domElement.style.touchAction = 'none';
controls.minPolarAngle = Math.PI * 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
// 调试/截图用：?az=45 可以把相机绕目标转一个角度
const AZ = parseFloat(new URLSearchParams(location.search).get('az') || 'NaN');
const EL = parseFloat(new URLSearchParams(location.search).get('el') || 'NaN');
if (!Number.isNaN(AZ)) {
  const off = camera.position.clone().sub(controls.target);
  const rad = (AZ * Math.PI) / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  camera.position.set(
    controls.target.x + off.x * cos - off.z * sin,
    controls.target.y + off.y,
    controls.target.z + off.x * sin + off.z * cos
  );
}
if (!Number.isNaN(EL)) {
  const off = camera.position.clone().sub(controls.target);
  const r = Math.hypot(off.x, off.z);
  const rad = (EL * Math.PI) / 180;
  camera.position.set(controls.target.x + off.x, controls.target.y + r * Math.tan(rad), controls.target.z + off.z);
}
controls.addEventListener('change', () => fitView());
controls.update();

// —— 机位记忆：优先用上次保存的默认机位 ——
let camSaveTimer = 0;
let lastCamSig = '';
function camSig() {
  const f = (v) => v.toFixed(2);
  return camera.position.toArray().map(f).join(',') + '|' + controls.target.toArray().map(f).join(',');
}
function saveCamera() {
  // 阻尼未停时 change 会每帧触发：这里只做"限频 + 去重"，不是每帧都发请求
  if (camSaveTimer) return;
  camSaveTimer = setTimeout(() => {
    camSaveTimer = 0;
    const sig = camSig();
    if (sig === lastCamSig) return;      // 和上次保存的一样，跳过
    lastCamSig = sig;
    fetch(API('/aurabot/api/ext/room3d/api/room/camera'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pos: camera.position.toArray(), target: controls.target.toArray() }),
    }).catch(() => {});
  }, 900);
}
controls.addEventListener('change', saveCamera);

(async () => {
  try {
    const r = await fetch(API('/aurabot/api/ext/room3d/api/room/camera'));
    if (!r.ok) return;
    const c = await r.json();
    if (!c || !c.ok || !Array.isArray(c.pos) || !Array.isArray(c.target)) return;
    camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
    controls.target.set(c.target[0], c.target[1], c.target[2]);
    controls.update();
    fitView();
    lastCamSig = camSig();   // 记住已同步，避免加载后立刻又存一遍
  } catch (e) { /* ignore */ }
})();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fitView();
});

/* ===== 贴图 ===== */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  return t;
}
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#b98a5e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 8; i++) {
    const y = i * h / 8;
    g.fillStyle = ['#c1926a', '#b1835a', '#c79a72', '#ab7c55'][i % 4];
    g.fillRect(0, y, w, h / 8 - 2);
    g.strokeStyle = 'rgba(90,60,38,.32)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    for (let k = 0; k < 22; k++) {
      g.strokeStyle = 'rgba(120,84,54,.16)'; g.lineWidth = 1;
      const yy = y + Math.random() * (h / 8 - 3);
      g.beginPath(); g.moveTo(Math.random() * w, yy); g.lineTo(Math.random() * w, yy); g.stroke();
    }
  }
}, { repeat: [9, 9] });
const wallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#e8dfd2'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { g.fillStyle = 'rgba(206,196,180,.4)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, { repeat: [2, 1] });
const rugTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9c6a8'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 6) for (let x = 0; x < w; x += 6) {
    g.fillStyle = (x + y) % 12 === 0 ? 'rgba(150,120,86,.28)' : 'rgba(255,250,240,.22)';
    g.fillRect(x, y, 5, 5);
  }
  g.strokeStyle = 'rgba(120,92,64,.45)'; g.lineWidth = 9; g.strokeRect(6, 6, w - 12, h - 12);
});
const screenTex = canvasTex(512, 288, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#2b4d78'); grd.addColorStop(0.55, '#16283f'); grd.addColorStop(1, '#0a1220');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(150,200,255,.35)';
  g.beginPath(); g.arc(w * 0.68, h * 0.34, 46, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,225,170,.28)';
  g.beginPath(); g.arc(w * 0.30, h * 0.66, 60, 0, 7); g.fill();
  for (let i = 0; i < 5; i++) {
    g.fillStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.08})`;
    g.fillRect(0, h * (0.2 + i * 0.13), w, 3);
  }
  g.fillStyle = 'rgba(8,12,18,.55)';
  g.fillRect(0, h - 34, w, 34);
  g.fillStyle = 'rgba(200,225,255,.65)';
  g.fillRect(18, h - 24, 120, 8);
  g.fillRect(150, h - 24, 60, 8);
});

const seaCanvas = document.createElement('canvas');
seaCanvas.width = 1024; seaCanvas.height = 512;
(function (g, w, h) {
  // 天空
  const sky = g.createLinearGradient(0, 0, 0, h * 0.52);
  sky.addColorStop(0, '#4a90d9'); sky.addColorStop(0.6, '#9fd2f0'); sky.addColorStop(1, '#dff0fb');
  g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.52);
  // 云
  for (let i = 0; i < 14; i++) {
    g.fillStyle = 'rgba(255,255,255,.75)';
    const cx = Math.random() * w, cy = 30 + Math.random() * h * 0.28, r = 18 + Math.random() * 34;
    for (let k = 0; k < 5; k++) {
      g.beginPath(); g.arc(cx + k * r * 0.7, cy + Math.sin(k) * 6, r * (0.5 + Math.random() * 0.5), 0, 7); g.fill();
    }
  }
  // 太阳
  g.fillStyle = 'rgba(255,246,214,.95)'; g.beginPath(); g.arc(w * 0.78, h * 0.16, 34, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,240,190,.25)'; g.beginPath(); g.arc(w * 0.78, h * 0.16, 76, 0, 7); g.fill();
  // 海
  const sea = g.createLinearGradient(0, h * 0.52, 0, h * 0.82);
  sea.addColorStop(0, '#3fa7c9'); sea.addColorStop(0.55, '#2b86ab'); sea.addColorStop(1, '#1f6b8c');
  g.fillStyle = sea; g.fillRect(0, h * 0.52, w, h * 0.30);
  // 浪花
  for (let i = 0; i < 260; i++) {
    const y = h * 0.53 + Math.random() * h * 0.28;
    g.strokeStyle = `rgba(255,255,255,${0.10 + Math.random() * 0.35})`;
    g.lineWidth = 1 + Math.random() * 2;
    const x = Math.random() * w, len = 12 + Math.random() * 60;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
  }
  // 沙滩
  const sand = g.createLinearGradient(0, h * 0.80, 0, h);
  sand.addColorStop(0, '#f0dfb8'); sand.addColorStop(0.35, '#e8d3a4'); sand.addColorStop(1, '#dcc38c');
  g.fillStyle = sand; g.beginPath();
  g.moveTo(0, h * 0.82);
  for (let x = 0; x <= w; x += 32) g.lineTo(x, h * 0.82 + Math.sin(x * 0.012) * 10);
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();
  // 湿沙带
  g.fillStyle = 'rgba(200,175,130,.55)';
  g.beginPath(); g.moveTo(0, h * 0.84);
  for (let x = 0; x <= w; x += 32) g.lineTo(x, h * 0.84 + Math.sin(x * 0.01 + 1) * 8);
  g.lineTo(w, h * 0.90); g.lineTo(0, h * 0.90); g.closePath(); g.fill();
})(seaCanvas.getContext('2d'), 1024, 512);
function makeSeaview(mode, withSand = true) {
  const c = document.createElement('canvas');
  c.width = 768; c.height = 512;
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const skyTop = mode === 'dusk' ? '#2b2a4a' : mode === 'night' ? '#0a1430' : '#4a90d9';
  const skyMid = mode === 'dusk' ? '#e2703a' : mode === 'night' ? '#152645' : '#9fd2f0';
  const skyLow = mode === 'dusk' ? '#ffc46b' : mode === 'night' ? '#20405f' : '#dff0fb';
  const sky = g.createLinearGradient(0, 0, 0, h * 0.58);
  sky.addColorStop(0, skyTop); sky.addColorStop(0.55, skyMid); sky.addColorStop(1, skyLow);
  g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.58);

  if (mode === 'dusk') {
    // 落日：贴在海平线上的大太阳 + 光晕
    g.fillStyle = 'rgba(255,150,80,.35)';
    g.beginPath(); g.arc(w * 0.52, h * 0.56, 120, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,206,120,.85)';
    g.beginPath(); g.arc(w * 0.52, h * 0.56, 62, 0, 7); g.fill();
    g.fillStyle = '#fff3cf';
    g.beginPath(); g.arc(w * 0.52, h * 0.56, 40, 0, 7); g.fill();
    // 晚霞条带
    for (let i = 0; i < 26; i++) {
      g.fillStyle = `rgba(255,${170 + Math.random() * 60},${120 + Math.random() * 60},${0.05 + Math.random() * 0.12})`;
      g.fillRect(0, h * (0.12 + Math.random() * 0.4), w, 4 + Math.random() * 12);
    }
  } else if (mode === 'night') {
    for (let i = 0; i < 140; i++) {
      g.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.7})`;
      g.fillRect(Math.random() * w, Math.random() * h * 0.5, 2, 2);
    }
    g.fillStyle = 'rgba(232,240,255,.95)';
    g.beginPath(); g.arc(w * 0.72, h * 0.18, 26, 0, 7); g.fill();
  } else {
    for (let i = 0; i < 10; i++) {
      g.fillStyle = 'rgba(255,255,255,.7)';
      const cx = Math.random() * w, cy = 30 + Math.random() * h * 0.25, r = 16 + Math.random() * 30;
      for (let k = 0; k < 5; k++) {
        g.beginPath(); g.arc(cx + k * r * 0.7, cy + Math.sin(k) * 5, r * 0.6, 0, 7); g.fill();
      }
    }
    g.fillStyle = 'rgba(255,246,214,.9)';
    g.beginPath(); g.arc(w * 0.78, h * 0.14, 28, 0, 7); g.fill();
  }

  // 海
  const seaTop = mode === 'dusk' ? '#b5623f' : mode === 'night' ? '#0d2138' : '#3fa7c9';
  const seaBot = mode === 'dusk' ? '#4a3352' : mode === 'night' ? '#050b16' : '#1f6b8c';
  const sea = g.createLinearGradient(0, h * 0.58, 0, h * 0.84);
  sea.addColorStop(0, seaTop); sea.addColorStop(1, seaBot);
  g.fillStyle = sea; g.fillRect(0, h * 0.58, w, h * 0.26);
  // 波光
  for (let i = 0; i < 200; i++) {
    const y = h * 0.585 + Math.random() * h * 0.24;
    const a = mode === 'dusk' ? 0.15 + Math.random() * 0.4 : 0.08 + Math.random() * 0.25;
    g.strokeStyle = mode === 'dusk' ? `rgba(255,210,150,${a})` : `rgba(255,255,255,${a})`;
    g.lineWidth = 1 + Math.random() * 2;
    const x = Math.random() * w, len = 10 + Math.random() * 50;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
  }
  if (mode === 'dusk') {
    // 落日在水面拉出的那条光路
    const gl = g.createLinearGradient(0, h * 0.58, 0, h * 0.84);
    gl.addColorStop(0, 'rgba(255,190,120,.55)'); gl.addColorStop(1, 'rgba(255,150,90,0)');
    g.fillStyle = gl;
    g.beginPath(); g.moveTo(w * 0.44, h * 0.58); g.lineTo(w * 0.60, h * 0.58);
    g.lineTo(w * 0.66, h * 0.84); g.lineTo(w * 0.38, h * 0.84); g.closePath(); g.fill();
  }

  if (!withSand) {
    // 窗户里只要天与海：海面直接铺到画面底部
    g.fillStyle = seaBot;
    g.fillRect(0, h * 0.84, w, h * 0.16);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  // 沙滩
  const sandTop = mode === 'dusk' ? '#c99a6d' : mode === 'night' ? '#2a2a33' : '#f0dfb8';
  const sandBot = mode === 'dusk' ? '#8d6a52' : mode === 'night' ? '#15151c' : '#dcc38c';
  const sand = g.createLinearGradient(0, h * 0.82, 0, h);
  sand.addColorStop(0, sandTop); sand.addColorStop(1, sandBot);
  g.fillStyle = sand; g.beginPath();
  g.moveTo(0, h * 0.83);
  for (let x = 0; x <= w; x += 28) g.lineTo(x, h * 0.83 + Math.sin(x * 0.014) * 9);
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

    box(0.09, h, T * 0.7, fm, x, sill, z);               // 中挺
    box(0.02, h - T * 2, w - T * 2, M.glassPane, x, sill + T, z);

  const t = tail.replace(/^原地/, '').trim();
  return t || name;
}

async function loadAnims() {
  try {
    const r = await fetch(API('/aurabot/api/ext/room3d/api/room/anims'));
    const j = await r.json();
    if (j && j.ok && Array.isArray(j.anims) && j.anims.length) {
      ANIM_LIST = j.anims.map((x) => [x, shortLabel(x)]);
      ANIM_POOL = [];
      console.log('[anims] 载入', ANIM_LIST.length, '个动作');
    }
  } catch (e) { /* ignore */ }
}
setTimeout(loadAnims, 300);   // 等 TOKEN/API 初始化完再拉清单

function pickAnim() {
  if (!ANIM_LIST.length && typeof ACTION_CLIPS !== 'undefined') {
    // 接口没拉到就退回内置清单，保证动作不哑火
    ANIM_LIST = ACTION_CLIPS.map(([label, clip]) => [clip, label]);
  }
  if (!ANIM_LIST.length) return null;
  if (!ANIM_POOL.length) {
    ANIM_POOL = ANIM_LIST.slice();
    for (let i = ANIM_POOL.length - 1; i > 0; i--) {
      const k = (Math.random() * (i + 1)) | 0;
      const t = ANIM_POOL[i]; ANIM_POOL[i] = ANIM_POOL[k]; ANIM_POOL[k] = t;
    }
  }
  return ANIM_POOL.splice((Math.random() * ANIM_POOL.length) | 0, 1)[0];
}
let actionLockUntil = 0;

// ===== 右键菜单：给某个人物挑动作 =====
const MENU_GROUPS = [
  ['吃什么', (n) => n.startsWith('吃')],
  ['玩耍', (n) => /(玩|球|棋|魔术|陀螺|风筝|秋千|积木|魔方)/.test(n)],
  ['时节', (n) => /(春节|中秋|端午|元宵|圣诞|万圣|重阳|腊八|雪|烟花|灯)/.test(n)],
  ['点击回应', (n) => n.startsWith('点击回应')],
  ['工作状态', (n) => n.startsWith('工作状态')],
  ['碎碎念', (n) => n.startsWith('碎碎念')],
  ['余额档位', (n) => n.startsWith('余额')],
  ['小动作', () => true],
];

function groupAnims() {
  const used = new Set();
  const out = [];
  for (const [title, test] of MENU_GROUPS) {
    const items = ANIM_LIST.filter(([name]) => !used.has(name) && test(name));
    items.forEach(([name]) => used.add(name));
    if (items.length) out.push([title, items]);
  }
  return out;
}

function playPick(who, asset, label) {
  const now = performance.now();
  const a = actors[who];
  const dur = 8000 + Math.random() * 3000;
  a.bubble.until = now + dur - 400;
  a.actionUntil = now + dur;
  a.path.length = 0;
  drawBubble(a.bubble, label);
  a.bubble.sp.visible = true;
  setClip(a.obj, asset);
  actionLockUntil = Math.max(actionLockUntil, now + 1500);
  logRoom(who, label);
  closeMenu();

function openMenu(who, x, y) {
  const hasActions = who !== 'dayu' && ANIM_LIST.length > 0;
  menuEl.innerHTML = '';
  const head = document.createElement('div');
  head.textContent = (LABELS[who] ? LABELS[who].textContent : who) + (hasActions ? ' · 选个动作' : ' · 无');
  head.style.cssText = 'padding:6px 10px 8px;font-weight:600;opacity:.75;border-bottom:1px solid rgba(255,255,255,.12)';
  menuEl.appendChild(head);

  if (!hasActions) {

    none.textContent = '无（这个角色还没有动作素材）';
    none.style.cssText = 'padding:10px;opacity:.45';
    menuEl.appendChild(none);
  } else {
    for (const [title, items] of groupAnims()) {
      const t = document.createElement('div');
      t.textContent = title;
      t.style.cssText = 'padding:7px 10px 3px;font-size:11px;letter-spacing:.06em;opacity:.55';
      menuEl.appendChild(t);

        it.onclick = () => playPick(who, asset, label);
        menuEl.appendChild(it);
      }

  menuEl.style.display = 'block';
  menuOpenedAt = performance.now();
  menuEl.style.left = Math.min(x, innerWidth - menuEl.offsetWidth - 12) + 'px';
  menuEl.style.top = Math.min(y, innerHeight - menuEl.offsetHeight - 12) + 'px';

// 命中检测：屏幕坐标 → 哪个角色
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickActorAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = ACTORS.map((w) => actors[w].obj.children[0]).filter(Boolean);
  const hit = ray.intersectObjects(targets, false)[0];
  if (hit) return ACTORS.find((w) => actors[w].obj.children[0] === hit.object) || null;

  // 兜底：手机点击像素很粗，角色投影点 46px 内也算命中
  let best = null;
  let bestD = 46;
  const p = new THREE.Vector3();
  for (const w of ACTORS) {
    p.copy(actors[w].pos);
    p.y = 1.0;
    p.project(camera);
    const sx = (p.x * 0.5 + 0.5) * innerWidth;
    const sy = (-p.y * 0.5 + 0.5) * innerHeight;
    const d = Math.hypot(sx - cx, sy - cy);
    if (d < bestD) { bestD = d; best = w; }
  }
  return best;
}

const HOLD_MS = 1500;
const ringEl = document.createElement('div');
ringEl.style.cssText = [

].join(';');
document.body.appendChild(ringEl);
const ringIdleShadow = ringEl.style.boxShadow;

const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const dragPt = new THREE.Vector3();
const dragRay = new THREE.Raycaster();
const serverSpot = {};          // 服务端最后一次给的位置，用来判断"被系统挪走了"
let hold = null;
let lastDragEndAt = 0;

function resetRing() {
  ringEl.style.display = 'none';
  ringEl.style.boxShadow = ringIdleShadow;
  ringEl.style.background = 'conic-gradient(#ffcf72 0deg, rgba(255,255,255,.16) 0deg)';
}

function startHold(who, x, y) {
  if (hold) return;
  controls.enabled = false;                  // 蓄力/拖拽期间不转镜头
  ringEl.style.display = 'block';
  ringEl.style.left = x + 'px';
  ringEl.style.top = y + 'px';
  hold = { who, x0: x, y0: y, t0: performance.now(), ready: false, raf: 0 };
  const tick = () => {
    if (!hold) return;
    const p = Math.min(1, (performance.now() - hold.t0) / HOLD_MS);
    ringEl.style.background =
      `conic-gradient(#ffcf72 ${p * 360}deg, rgba(255,255,255,.16) 0deg)`;
    if (p >= 1 && !hold.ready) {
      hold.ready = true;
      ringEl.style.boxShadow = '0 0 0 3px #ffcf72 inset, 0 0 22px rgba(255,207,114,.6)';
      const a = actors[hold.who];
      a.path.length = 0;
      a.dragging = true;
    }
    if (hold && p < 1) hold.raf = requestAnimationFrame(tick);
  };
  hold.raf = requestAnimationFrame(tick);
}

function moveDragged(x, y) {
  if (!hold || !hold.ready) return;
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  dragRay.setFromCamera(ndc, camera);
  if (!dragRay.ray.intersectPlane(dragPlane, dragPt)) return;
  const a = actors[hold.who];
  a.pos.x = Math.max(0.3, Math.min(12.4, dragPt.x));
  a.pos.z = Math.max(0.3, Math.min(12.4, dragPt.z));
  a.obj.position.set(a.pos.x, 0, a.pos.z);
}

function endHold(commit) {
  if (!hold) return;
  const { who, ready, raf } = hold;
  cancelAnimationFrame(raf);
  const a = actors[who];
  a.dragging = false;
  if (ready && commit) {
    // 吸附到最近的空地，落到家具里不会卡住
    const [fx, fz] = snapFree(a.pos.x, a.pos.z);
    a.pos.set(fx, 0, fz);
    a.obj.position.set(fx, 0, fz);
    a.spot = '__free';            // 暂停自动寻路，直到系统真的改了位置
    a.freeFrom = serverSpot[who];
    a.path.length = 0;
  }
  if (ready) lastDragEndAt = performance.now();
  hold = null;
  resetRing();
  controls.enabled = true;
}

// —— 双指缩放（手机）——
const _touches = new Map();
let _pinchDist = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  _touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (_touches.size === 2) {
    const [a, b] = [..._touches.values()];
    _pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    controls.enabled = false;      // 双指时先别转视角
  }
}, true);

renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch' || !_touches.has(e.pointerId)) return;
  _touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (_touches.size < 2) return;
  const [a, b] = [..._touches.values()];
  const d = Math.hypot(a.x - b.x, a.y - b.y);
  if (_pinchDist > 8 && d > 8) {
    const ratio = _pinchDist / d;
    zoomFactor = Math.min(2.4, Math.max(0.45, zoomFactor * (1 + (ratio - 1) * 0.95)));
    fitView();
  }
  _pinchDist = d;
}, true);

function _endTouch(e) {
  if (!_touches.has(e.pointerId)) return;
  _touches.delete(e.pointerId);
  if (_touches.size < 2) {
    _pinchDist = 0;
    if (!dragItem) controls.enabled = true;
  }
}
renderer.domElement.addEventListener('pointerup', _endTouch, true);
renderer.domElement.addEventListener('pointercancel', _endTouch, true);

function doAction(who) {
  if (who !== 'xiaoyu') return;           // 只有她会动
  const now = performance.now();
  if (now < actionLockUntil) return;       // 全局互斥：同一时刻只一个人演
  const picked = pickAnim();
  if (!picked) return;
  const [asset, label] = picked;
  const dur = 8000 + Math.random() * 7000; // 8~15 秒
  actionLockUntil = now + dur;
  const a = actors[who];
  a.bubble.until = now + dur - 400;
  a.actionUntil = now + dur;
  drawBubble(a.bubble, label);
  a.bubble.sp.visible = true;
  setClip(a.obj, asset);
  logRoom(who, label);
}

/* ===== 同步 ===== */
let lastLogLen = 0;
async function poll() {
  try {
    const r = await fetch(API('/aurabot/api/ext/room3d/api/room/state'));
    if (!r.ok) return;
    const s = await r.json();
    for (const who of ACTORS) {
      const d = s[who];
      if (!d || !d.spot) continue;
      serverSpot[who] = d.spot;
      if (actors[who].spot === '__free' && d.spot === actors[who].freeFrom) continue;
      const target = spots[d.spot] ? d.spot : 'sofa';
      if (target !== actors[who].spot) goTo(who, target);
    }
    if (Array.isArray(s.log) && s.log.length > lastLogLen) {
      const latest = s.log[s.log.length - 1];
      lastLogLen = s.log.length;
      if (latest && latest.text) {
        const a = actors[latest.who === 'dayu' ? 'dayu' : 'xiaoyu'];
        a.bubble.until = performance.now() + 3200;
        drawBubble(a.bubble, latest.text);
        a.bubble.sp.visible = true;
      }
    }
  } catch (e) { /* ignore */ }
}
poll();
setInterval(poll, 5000);

/* ===== 时间 ===== */
function applyTimeOfDay() {
  const forcedHour = parseInt(new URLSearchParams(location.search).get('hour') || '', 10);
  const h = Number.isNaN(forcedHour) ? new Date().getHours() : forcedHour;
  const LAMPS_ON = h >= 8 && h < 22;   // 22:00 关灯，08:00 开灯
  const day = h >= 7 && h < 17, dusk = h >= 17 && h < 19;
  const mode = day ? 'day' : dusk ? 'dusk' : 'night';
  if (seaViewMat && seaViewMat.map !== seaViews[mode]) {
    seaViewMat.map = seaViews[mode];
    seaViewMat.needsUpdate = true;
  }
  if (winViewMat && winViewMat.map !== winSeaviews[mode]) {
    winViewMat.map = winSeaviews[mode];
    winViewMat.needsUpdate = true;
  }
  // 灯：22:00~08:00 全灭
  lampMat.emissiveIntensity = LAMPS_ON ? 2.0 : 0.04;
  lampMat.color.set(LAMPS_ON ? '#fff0c2' : '#6b6b72');
  for (const l of lampLights) l.intensity = LAMPS_ON ? 2.05 : 0;
  for (const m of haloMats) m.opacity = LAMPS_ON ? 0.55 : 0.0;
  tvLight.intensity = LAMPS_ON ? 2.6 : 0.6;
  tvGlow.intensity = LAMPS_ON ? 1.6 : 0.4;
  deskLight.intensity = LAMPS_ON ? 1.1 : 0.15;

  if (!LAMPS_ON) {
    hemi.intensity = 0.30; dir.intensity = 0.22;
    document.getElementById('clockTxt').textContent += '（已熄灯）';
    return;
  }
  hemi.intensity = day ? 1.26 : dusk ? 0.96 : 0.72;
  dir.intensity = day ? 1.40 : dusk ? 0.92 : 0.50;
  document.getElementById('clockTxt').textContent =
    String(h).padStart(2, '0') + ':' + String(new Date().getMinutes()).padStart(2, '0');
}
applyTimeOfDay();
setInterval(applyTimeOfDay, 60000);

/* ===== 主循环 ===== */
const LABELS = {
  xiaoyu: document.getElementById('nx'),
};
const tmpV = new THREE.Vector3();
const clock = new THREE.Clock();

function stepActor(who, dt, now) {
  const a = actors[who];
  const ud = a.obj.userData;
  let moving = false;

  if (a.dragging) { a.path.length = 0; }
  if (!a.path.length) a.walkClock = 0;
  const inAction = a.actionUntil && now < a.actionUntil;
  if (a.wasActing && !inAction && a.pendingSpot && a.pendingSpot !== a.spot) {
    const next = a.pendingSpot; a.pendingSpot = null; goTo(who, next);
  }
  a.wasActing = inAction;
  // 动作期间：清路径、钉在原地（文档里的 pinTarget）
  if (inAction) {
    a.path.length = 0;
  } else if (a.path.length) {
    // 走路动画驱动：前摇站住 → 跑动 → 到截断点立刻停（不播后摇）
    const walkName = clipFor(who, 'walk');
    if (ud.clip !== walkName) {
      setClip(a.obj, walkName);
      a.walkClock = now;                 // 每次从头播走路，重置逻辑时钟
    }
    if (!a.walkClock) a.walkClock = now;
    // 视频可能被浏览器挂起（currentTime 卡 0），这里每帧重试
    if (ud.video && ud.video.paused) ud.video.play().catch(() => {});
    const elapsed = (now - a.walkClock) / 1000;   // 逻辑秒数，不依赖视频
    if (elapsed >= WALK_CUT) {
      if (Math.random() < 0.85 && now >= actionLockUntil) {
        a.path.length = 0;
        doAction(who);
      } else {
        a.walkClock = now - WALK_WINDUP * 1000;   // 截断后从跑动起点继续
        try { ud.video.currentTime = WALK_WINDUP; } catch (e) { /* ignore */ }
      }
    }
    // 途中随机打断：每 2.5~5.5 秒判一次，50% 概率
    if (moving && now >= (a.nextInterrupt || 0)) {
      a.nextInterrupt = now + 2500 + Math.random() * 3000;
      if (Math.random() < 0.5 && now >= actionLockUntil) {
        a.path.length = 0;
        doAction(who);
      }
    }
    const ct = elapsed;                          // 兼容后面的判断
    if (a.path.length && ct >= WALK_WINDUP) {    // 路径可能刚被动作打断清空
      const [tx, tz] = a.path[0];
      const dx = tx - a.pos.x, dz = tz - a.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.12) a.path.shift();
      else {
        const k = Math.min(1, (SPEED * dt) / dist);
        a.pos.x += dx * k; a.pos.z += dz * k;
        moving = true;
        const sdx = dx - dz;
        if (Math.abs(sdx) > 0.02) a.facing = sdx < 0 ? -1 : 1;
      }
    }
    // ct < WALK_WINDUP：前摇阶段，站住不动
  }

  // 卡在障碍里：慢慢挪出来；但不要清路径（以前清了，等于永远走不动）
  if (!isFree(toCell(a.pos.x), toCell(a.pos.z))) {
    const [fx, fz] = nearestFree(toCell(a.pos.x), toCell(a.pos.z));
    const gx = (fx + 0.5) * CELL, gz = (fz + 0.5) * CELL;
    const dx = gx - a.pos.x, dz = gz - a.pos.z;
    const d = Math.hypot(dx, dz) || 1e-6;
    if (d > 0.02) {
      const stepLen = Math.min(d, SPEED * 0.8 * dt);
      a.pos.x += (dx / d) * stepLen;
      a.pos.z += (dz / d) * stepLen;
      if (!a.path.length) moving = true;   // 只在没走路时才算"挪动"
    }
  }

  // 自己走到的地点同步给服务端（否则 5 秒轮询会把人拉回去）
  if (!a.path.length && a.reportSpot) {
    const sp = a.reportSpot;
    a.reportSpot = null;
    fetch(API('/aurabot/api/ext/room3d/api/room/move'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ who, spot: sp, reason: '自己走过去' }),
    }).catch(() => {});
  }

  a.walking = moving;
  const bob = moving ? Math.abs(Math.sin(now * 0.011)) * 0.03 : Math.sin(now * 0.0016) * 0.008;
  a.obj.position.set(a.pos.x, bob, a.pos.z);
  const want = inAction ? null : (a.path.length ? clipFor(who, 'walk') : clipFor(who, 'idle'));
  if (!inAction && ud.clip !== want) setClip(a.obj, want, false);
  const v = ud.video;
  const vw = v.videoWidth || 9, vh = v.videoHeight || 16;
  ud.mesh.scale.set(CHAR_H * (vw / vh) * a.facing, CHAR_H, 1);
  ud.mesh.position.y = CHAR_H / 2;
  ud.mesh.quaternion.copy(camera.quaternion);
  ud.shadow.scale.set(CHAR_H * 0.55, CHAR_H * 0.35, 1);
  if (a.bubble.sp.visible) {
    a.bubble.sp.position.set(a.pos.x, 2.08 + bob, a.pos.z);
    if (now > a.bubble.until) a.bubble.sp.visible = false;
  }
  tmpV.set(a.pos.x, 1.52 + bob, a.pos.z).project(camera);
  const el = LABELS[who];
  el.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px';
  el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight) + 'px';
  el.style.opacity = (tmpV.z < 1 && !a.bubble.sp.visible) ? 1 : 0;
}
function randomStroll(who, now) {
  if (DEBUG_BUBBLE) return;
  const a = actors[who];
  if (a.path.length) return;                     // 已经在走
  if (a.actionUntil && now < a.actionUntil) return;  // 自己在演动作
  STAT.stroll++;
  const keys = Object.keys(spots);
  // 避开别人正在用的地点，避免两个人叠在一起（视觉上会被数成一个人）
  const used = new Set(ACTORS.filter((w) => w !== who).map((w) => actors[w].spot));
  const free = keys.filter((k) => !used.has(k) && k !== a.spot);
  const pool = free.length ? free : keys.filter((k) => k !== a.spot);
  const target = pool[(Math.random() * pool.length) | 0] || keys[0];
  a.reportSpot = target;          // 走到了就同步给服务端
  goTo(who, target);
}
let lastStroll = 0;
const STAT = { stroll: 0, go: 0, ok: 0, near: 0, act: 0, short: 0 };
// 启动自检：任意两点之间能不能走通
setTimeout(() => {
  const ks = Object.keys(spots);
  let bad = [];
  for (const a of ks) for (const b of ks) {
    if (a >= b) continue;
    const [x1, z1] = spots[a], [x2, z2] = spots[b];
    if (astar(toCell(x1), toCell(z1), toCell(x2), toCell(z2)).length < 2) bad.push(a + '-' + b);
  }
  STAT.unreachable = bad;
}, 2500);

let _lastPaint = 0;
const PAINT_MS = PC_MODE ? 33 : 0;   // PC 限制 30fps

function loop() {
  if (PAINT_MS) {
    const nowMs = performance.now();
    if (nowMs - _lastPaint < PAINT_MS) { requestAnimationFrame(loop); return; }
    _lastPaint = nowMs;
  }
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  for (const who of ACTORS) stepActor(who, dt, now);
  if (now - lastStroll > 4200) { lastStroll = now; randomStroll(ACTORS[(Math.random() * ACTORS.length) | 0], now); }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function fb(g, mat, w, h, d, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  if (ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  g.add(m); return m;
}
function fc(g, mat, r, h, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m); return m;
}

function buildInstance(it) {
  const def = FURN_BY_ID[it.type];
  if (!def) return null;
  const g = new THREE.Group();
  def.build(g);
  g.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.userData.base = o.material;
    o.material = o.material.clone();
    if (it.tint && TINTABLE.has(o.userData.base)) o.material.color.set(it.tint);
  });
  g.position.set(it.x, 0, it.z);
  g.rotation.y = it.rot || 0;
  g.scale.setScalar(it.s || 1);
  g.userData.item = it;
  furnRoot.add(g);
  return g;
}

// 放置时把重叠的家具推开（地毯类不参与，避免叠不上）
const _obb = new THREE.Box3();
function bboxOf(g) { return _obb.setFromObject(g); }

function pushApart(it, g) {
  const b = bboxOf(g);
  const h = b.max.y - b.min.y;
  if (h < 0.22) return;              // 地毯/坐垫这类平的不推
  for (let pass = 0; pass < 6; pass++) {
    let moved = false;
    for (const other of furnRoot.children) {
      if (other === g) continue;
      const ob = bboxOf(other);
      if (ob.max.y - ob.min.y < 0.22) continue;
      const ox = Math.min(b.max.x, ob.max.x) - Math.max(b.min.x, ob.min.x);
      const oz = Math.min(b.max.z, ob.max.z) - Math.max(b.min.z, ob.min.z);
      if (ox <= 0.02 || oz <= 0.02) continue;
      if (ox < oz) { it.x += (it.x < (ob.min.x + ob.max.x) / 2 ? -1 : 1) * (ox + 0.06); }
      else { it.z += (it.z < (ob.min.z + ob.max.z) / 2 ? -1 : 1) * (oz + 0.06); }
      g.position.set(it.x, 0, it.z);
      b.setFromObject(g);
      moved = true;
    }
    if (!moved) break;
  }
}

function placeAtPoint(type, x, z) {
  const it = { k: Math.random().toString(36).slice(2, 9), type, x: +x.toFixed(2), z: +z.toFixed(2), rot: 0, s: 1 };
  PLACED.push(it);
  const gi = buildInstance(it);
  if (gi) pushApart(it, gi);
  saveFurniture();
}

function placeAtCenter(type) {
  const [x, z] = centerGround();
  const it = { k: Math.random().toString(36).slice(2, 9), type, x: +x.toFixed(2), z: +z.toFixed(2), rot: 0, s: 1 };
  PLACED.push(it);
  const gc = buildInstance(it);
  if (gc) pushApart(it, gc);
  saveFurniture();
}
function pickInstance(cx, cy) {
  edNdc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  edRay.setFromCamera(edNdc, camera);
  const roots = [furnRoot, catRoot, wallRoot].filter(Boolean);
  const hits = edRay.intersectObjects(roots, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o.parent && o.parent !== furnRoot && o.parent !== catRoot && o.parent !== wallRoot) o = o.parent;
  return o;
}

function toggleBaseFurniture() {
  baseHidden = !baseHidden;
  scene.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    let p = o, inside = false;
    while (p) { if (p === furnRoot) { inside = true; break; } p = p.parent; }
    if (inside) return;
    if (FURN_MATS.has(o.material)) o.visible = !baseHidden;
  });
}

function setActorsVisible(vis) {
  try {
    ACTORS.forEach((w) => {
      const a = actors[w];
      if (a && a.obj) a.obj.visible = vis && !ABSENT.has(w);
    });
    Object.values(LABELS || {}).forEach((el) => {
      if (el) el.style.display = vis ? '' : 'none';
    });
    if (typeof applyActors === 'function') applyActors();
  } catch (_) { /* 角色还没初始化 */ }
}

function toggleEdit(on) {
  window.__EDIT = on;
  ED.style.display = on ? 'block' : 'none';
  setActorsVisible(!on);          // 编辑时隐藏角色
  controls.enabled = true;   // 编辑模式下仍可拖动房间换角度
  if (!on && selected) { selected = null; updateSelBox(); colorBar.style.display = 'none'; }
  if (!on) setActorsVisible(true);
}

// 编辑模式下的交互
let downAt = null;
let downMoved = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!window.__EDIT || e.button === 2) return;
  downAt = { x: e.clientX, y: e.clientY };
  downMoved = 0;

  if (wallMode) {
    edNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    edRay.setFromCamera(edNdc, camera);
    if (edRay.ray.intersectPlane(spotPlane, edHitPt)) {
      wallClick(edHitPt.x, edHitPt.z);
      e.stopPropagation();
      return;
    }
  }

  const g = pickInstance(e.clientX, e.clientY);
  selected = g;
  updateSelBox();
  setSelHelper(g);
  syncSizeUI();
  colorBar.style.display = (g && !g.userData.wall) ? 'flex' : 'none';
  if (!g) return;                 // 点空地：交给 OrbitControls 转视角
  if (g.userData.wall) {          // 隔断：只选中，不拖动
    e.stopPropagation();
    return;
  }

  edNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  edRay.setFromCamera(edNdc, camera);
  edRay.ray.intersectPlane(spotPlane, edHitPt);
  const it = g.userData.item;
  dragItem = it;
  dragOff = [it.x - edHitPt.x, it.z - edHitPt.z];
  controls.enabled = false;       // 拖家具时锁住镜头
  e.stopPropagation();
}, true);

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!window.__EDIT) return;
  if (downAt) downMoved = Math.max(downMoved, Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y));
  if (!dragItem) return;
  edNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  edRay.setFromCamera(edNdc, camera);
  if (!edRay.ray.intersectPlane(spotPlane, edHitPt)) return;
  dragItem.x = +(edHitPt.x + dragOff[0]).toFixed(2);
  dragItem.z = +(edHitPt.z + dragOff[1]).toFixed(2);
  selected.position.set(dragItem.x, 0, dragItem.z);
}, true);

renderer.domElement.addEventListener('pointerup', () => {
  if (!window.__EDIT) return;
  if (dragItem) {
    saveFurniture();
    dragItem = null;
    controls.enabled = true;
  } else if (ARMED && downAt && downMoved < 12) {
    edNdc.set((downAt.x / innerWidth) * 2 - 1, -(downAt.y / innerHeight) * 2 + 1);
    edRay.setFromCamera(edNdc, camera);
    if (edRay.ray.intersectPlane(spotPlane, edHitPt)) {
      placeAtPoint(ARMED, edHitPt.x, edHitPt.z);
    }
  }
  downAt = null;
}, true);

renderer.domElement.addEventListener('pointercancel', () => {
  if (dragItem) { dragItem = null; controls.enabled = true; }
  downAt = null;
}, true);

addEventListener('keydown', (e) => {
  if (!window.__EDIT || !selected) return;
  const it = selected.userData.item;
  if (e.key === 'r' || e.key === 'R') { it.rot += Math.PI / 2; selected.rotation.y = it.rot; saveFurniture(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const i = PLACED.indexOf(it);
    if (i >= 0) PLACED.splice(i, 1);
    furnRoot.remove(selected); selected = null; saveFurniture();
  }
});

function floorCanvas(size, draw, rx, ry) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 3, ry || 3);
  t.anisotropy = 4;
  return t;
}

// WALLS 在上面的寻路段已声明
let WALL_OPACITY = 26;          // 0~100

function applyWallOpacity(v, persist) {
  WALL_OPACITY = Math.max(0, Math.min(100, v | 0));
  const o = WALL_OPACITY / 100;
  M.wall.opacity = o;
  M.wall.transparent = o < 1;
  M.wall.depthWrite = o >= 0.999;
  M.wall.needsUpdate = true;
  edgeMat.opacity = Math.min(0.42, 0.12 + o * 0.5);
  edgeMat.needsUpdate = true;
  const lab = document.getElementById('ed-wallval');
  if (lab) lab.textContent = WALL_OPACITY + '%';
  const sl = document.getElementById('ed-wallop');
  if (sl && +sl.value !== WALL_OPACITY) sl.value = String(WALL_OPACITY);
  if (persist) { clearTimeout(window.__woTimer); window.__woTimer = setTimeout(saveFurniture, 350); }
}
let wallRoot = null;
let wallMode = false;
let wallStart = null;
let wallMarker = null;

function initWalls() {
  wallRoot = new THREE.Group();
  scene.add(wallRoot);
  const mk = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 12, 10),
    new THREE.MeshBasicMaterial({ color: '#ffcf72' }),
  );
  wallMarker = mk;
  mk.visible = false;
  scene.add(mk);
}

function makeWallMesh(w) {
  const dx = w.x2 - w.x1, dz = w.z2 - w.z1;
  const len = Math.hypot(dx, dz);
  if (len < 0.12) return null;
  const ang = Math.atan2(dx, dz);
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.09, WALL_H, len), M.wall);
  body.position.y = WALL_H / 2;
  body.castShadow = false; body.receiveShadow = false;
  g.add(body);
  const eg = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.09, WALL_H, len));
  const line = new THREE.LineSegments(eg, edgeMat);
  line.position.y = WALL_H / 2;
  g.add(line);
  g.position.set((w.x1 + w.x2) / 2, 0, (w.z1 + w.z2) / 2);
  g.rotation.y = ang;
  g.userData.wall = w;
  return g;
}

function renderWalls() {
  if (!wallRoot) return;
  while (wallRoot.children.length) wallRoot.remove(wallRoot.children[0]);
  for (const w of WALLS) {
    const g = makeWallMesh(w);
    if (g) wallRoot.add(g);
  }
}

function addWall(x1, z1, x2, z2) {
  const w = { k: Math.random().toString(36).slice(2, 9), x1: +x1.toFixed(2), z1: +z1.toFixed(2),
              x2: +x2.toFixed(2), z2: +z2.toFixed(2) };
  if (Math.hypot(w.x2 - w.x1, w.z2 - w.z1) < 0.2) return;
  WALLS.push(w);
  const g = makeWallMesh(w);
  if (g) wallRoot.add(g);
  saveFurniture();
}

function toggleWallMode() {
  wallMode = !wallMode;
  wallStart = null;
  if (wallMarker) wallMarker.visible = false;
  const b = ED.querySelector('#ed-wall');
  if (b) {
    b.style.background = wallMode ? '#3a3524' : '#2a2f38';
    b.style.borderColor = wallMode ? '#ffcf72' : '#666';
    b.textContent = wallMode ? '画隔断中…' : '隔断';
  }
}

function wallClick(x, z) {
  if (!wallStart) {
    wallStart = { x, z };
    wallMarker.position.set(x, 0.05, z);
    wallMarker.visible = true;
    return;
  }
  addWall(wallStart.x, wallStart.z, x, z);
  wallStart = null;
  wallMarker.visible = false;
}

      saveActors();
    };
    list.appendChild(b);
  });
  return box;
}

function adminModal(cb) {
  if (document.getElementById('pin-mask')) return;

  mask.id = 'pin-mask';

      border-radius:14px;padding:16px;color:#e9eef6;font-size:13px;text-align:center">
      <div style="margin-bottom:10px;opacity:.75">请输入管理密码</div>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off"
        style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:9px;font-size:18px;
        letter-spacing:6px;text-align:center;border:1px solid rgba(255,255,255,.22);
        background:#11161e;color:#fff;outline:none">

      <div style="display:flex;gap:8px;margin-top:6px">

          background:#2a2f38;color:#e9eef6">取消</button>
        <button id="pin-ok" style="flex:1;padding:8px;border-radius:9px;border:0;
          background:#ffcf72;color:#20160a;font-weight:600">确定</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  const inp = mask.querySelector('#pin-input');
  const err = mask.querySelector('#pin-err');
  setTimeout(() => inp.focus(), 50);

  function close() { mask.remove(); }
  function submit() {
    if (inp.value === ADMIN_PIN) {
      UNLOCKED = true;
      sessionStorage.setItem('room_admin', '1');
      close();
      cb();
    } else {
      err.textContent = '密码不对';
      inp.value = '';
      inp.focus();
    }
  }
  mask.querySelector('#pin-ok').onclick = submit;
  mask.querySelector('#pin-cancel').onclick = close;
  inp.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  mask.onclick = (e) => { if (e.target === mask) close(); };
}

function requireAdmin(cb) {
  if (UNLOCKED) { cb(); return; }
  adminModal(cb);
}

function gateButton(btn) {
  if (!btn) return;
  const orig = btn.onclick;
  btn.onclick = (e) => requireAdmin(() => { if (orig) orig.call(btn, e); });
}

/* ================= 猫咪（独立生物） ================= */
let CATS = [];                 // [{k,type,name,mood,x,z,rot,s}]
let catRoot = null;
let catMood = 'loving';        // 放置时的默认性格

const CAT_PRESETS = [
  { id: 'white',  name: '白猫', fur: '#f6f4ee', belly: '#ffffff', patch: null },
  { id: 'black',  name: '黑猫', fur: '#3b3a44', belly: '#4d4c58', patch: null },
  { id: 'yellow', name: '黄猫', fur: '#e8a35c', belly: '#fbeede', patch: null },
  { id: 'huamao', name: '花猫', fur: '#f4efe4', belly: '#ffffff', patch: '#e8a35c' },
];

// 兼容早期存的 orange / tabby / calico
const CAT_ALIAS = { orange: 'yellow', tabby: 'huamao', calico: 'huamao' };
function catPreset(id) {
  const key = CAT_ALIAS[id] || id;
  return CAT_PRESETS.find((c) => c.id === key) || CAT_PRESETS[0];
}

function buildCatMesh(g, preset) {
  const fur = new THREE.MeshStandardMaterial({ color: preset.fur, roughness: .95 });
  const belly = new THREE.MeshStandardMaterial({ color: preset.belly, roughness: .95 });
  const dark = new THREE.MeshStandardMaterial({ color: '#2a2830', roughness: .6 });
  const pinkM = new THREE.MeshStandardMaterial({ color: '#e8a3a3', roughness: .8 });
  const add = (geo, mat, x, y, z, sx, sy, sz, rx) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (sx !== undefined) m.scale.set(sx, sy, sz);
    if (rx) m.rotation.x = rx;
    m.castShadow = true;
    g.add(m);
    return m;
  };

  // 身体
  add(new THREE.SphereGeometry(0.17, 14, 10), fur, 0, 0.23, 0, 1, 0.85, 1.5);
  // 肚子
  add(new THREE.SphereGeometry(0.12, 12, 8), belly, 0, 0.17, 0.02, 1, 0.6, 1.2);
  // 头
  add(new THREE.SphereGeometry(0.115, 14, 10), fur, 0, 0.36, 0.23);
  // 耳朵
  for (const sx of [-1, 1]) {
    const ear = add(new THREE.ConeGeometry(0.05, 0.09, 8), fur, sx * 0.065, 0.46, 0.22);
    ear.rotation.z = sx * 0.25;
  }
  // 眼睛
  for (const sx of [-1, 1]) add(new THREE.SphereGeometry(0.018, 8, 6), dark, sx * 0.045, 0.375, 0.325);
  // 鼻子
  add(new THREE.SphereGeometry(0.012, 6, 6), pinkM, 0, 0.345, 0.34);
  // 四条腿
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    add(new THREE.CylinderGeometry(0.028, 0.03, 0.15, 8), fur, sx * 0.085, 0.075, sz * 0.12);
  }
  // 花猫：补几块花斑
  if (preset.patch) {
    const pm = new THREE.MeshStandardMaterial({ color: preset.patch, roughness: .95 });
    add(new THREE.SphereGeometry(0.09, 10, 8), pm, 0.07, 0.32, 0.02, 1, 0.7, 0.9);
    add(new THREE.SphereGeometry(0.07, 10, 8), pm, -0.06, 0.24, -0.1, 1, 0.6, 1);
    add(new THREE.SphereGeometry(0.055, 10, 8), pm, 0.02, 0.42, 0.2, 1, 0.75, 0.8);
  }

  // 尾巴（三节）
  const tail1 = add(new THREE.SphereGeometry(0.038, 8, 6), fur, 0, 0.28, -0.26);
  const tail2 = add(new THREE.SphereGeometry(0.034, 8, 6), fur, 0, 0.4, -0.32);
  const tail3 = add(new THREE.SphereGeometry(0.03, 8, 6), fur, 0, 0.52, -0.33);
  tail1.scale.set(1, 1, 1.2); tail2.scale.set(1, 1.2, 1); tail3.scale.set(1, 1.3, 1);
  return g;
}

function catLabelEl(name) {
  const el = document.createElement('div');
  el.textContent = name;
  el.style.cssText = 'position:fixed;transform:translate(-50%,-100%);padding:1px 8px;'
    + 'border-radius:999px;background:rgba(24,20,30,.62);color:#ffe6c8;font-size:11px;'
    + 'border:1px solid rgba(255,200,140,.35);pointer-events:none;white-space:nowrap;'
    + 'opacity:0;transition:opacity .2s;z-index:60';
  document.body.appendChild(el);
  return el;
}

function buildCatInstance(c) {
  const g = new THREE.Group();
  buildCatMesh(g, catPreset(c.type));
  g.position.set(c.x, 0, c.z);
  g.rotation.y = c.rot || 0;
  g.scale.setScalar(c.s || 1);
  g.userData.cat = c;
  g.userData.item = c;          // 复用选择/拖动/尺寸逻辑
  c._g = g;
  c._el = catLabelEl(c.name);
  catRoot.add(g);
  return g;
}

function renderCats() {
  if (!catRoot) return;
  for (const c of CATS) if (c._el) c._el.remove();
  while (catRoot.children.length) catRoot.remove(catRoot.children[0]);
  CATS.forEach(buildCatInstance);
}

function addCat(type, name, mood) {
  const [px, pz] = centerGround();
  const c = {
    k: Math.random().toString(36).slice(2, 9),
    type, name: name || catPreset(type).name, mood: mood || catMood,
    x: +px.toFixed(2), z: +pz.toFixed(2), rot: 0, s: 1,
    waitUntil: 0,
  };
  CATS.push(c);
  buildCatInstance(c);
  saveFurniture();
  return c;
}

// ---- 行为：自由走动 ----

// ---- 摸猫：飘心 + 猫跳一下 ----
// 摸猫反馈：名牌上冒一个心 + 猫跳一下（用名牌 DOM，保证一定渲染出来）
const HEART_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px">'
  + '<path d="M12 21S3.5 15.8 3.5 10.2C3.5 7.3 5.7 5 8.4 5c1.7 0 3 .9 3.6 2.1C12.6 5.9 13.9 5 15.6 5 '
  + 'c2.7 0 4.9 2.3 4.9 5.2C20.5 15.8 12 21 12 21z" fill="#ff4d7a" stroke="#fff" stroke-width="1.4"/></svg>';

function petCat(c) {
  window.__pets++;
  const now = performance.now() / 1000;
  c._hopUntil = now + 1.0;
  c._love = (c._love || 0) + 1;
  if (c._el) {
    c._el.innerHTML = HEART_SVG + ' ' + c.name;
    c._el.style.transform = 'translate(-50%,-100%) scale(1.3)';
    c._el.style.background = 'rgba(255,120,150,.85)';
    c._el.style.color = '#fff';
    clearTimeout(c._petTimer);
    c._petTimer = setTimeout(() => {
      if (!c._el) return;
      c._el.textContent = c.name;
      c._el.style.transform = 'translate(-50%,-100%)';
      c._el.style.background = 'rgba(24,20,30,.62)';
      c._el.style.color = '#ffe6c8';
    }, 1200);
  }
}

function stepHearts() { /* 名牌方案不需要逐帧更新 */ }

function pickCatAt(cx, cy) {
  if (!catRoot || !catRoot.children.length) return null;
  edNdc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  edRay.setFromCamera(edNdc, camera);
  const hits = edRay.intersectObjects(catRoot.children, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o.parent && o.parent !== catRoot) o = o.parent;
    if (o.userData.cat) return o.userData.cat;
  }
  let best = null, bestD = 60;
  for (const c of CATS) {
    const v = new THREE.Vector3(c.x, 0.22 * (c.s || 1), c.z).project(camera);
    const sx = (v.x * 0.5 + 0.5) * innerWidth;
    const sy = (-v.y * 0.5 + 0.5) * innerHeight;
    const d = Math.hypot(sx - cx, sy - cy);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function pickCatTarget(c) {
  const now = performance.now() / 1000;
  const loving = c.mood === 'loving';
  for (let tries = 0; tries < 24; tries++) {
    let x, z;
    if (loving && Math.random() < 0.62) {
      const who = ACTORS[(Math.random() * ACTORS.length) | 0];
      const a = actors[who];
      if (a && a.pos) {
        x = a.pos.x + (Math.random() - 0.5) * 1.2;
        z = a.pos.z + (Math.random() - 0.5) * 1.2;
      }
    }
    if (x === undefined) {
      x = 0.6 + Math.random() * 10.9;
      z = 0.6 + Math.random() * 10.9;
    }
    const RR = 0.16 * (c.s || 1);
    if (!isFree(toCell(x), toCell(z))) continue;
    if (!isFree(toCell(x + RR), toCell(z)) || !isFree(toCell(x - RR), toCell(z))) continue;
    if (!isFree(toCell(x), toCell(z + RR)) || !isFree(toCell(x), toCell(z - RR))) continue;
    if (!loving) {
      let far = true;
      for (const w of ACTORS) {
        const a = actors[w];
        if (a && a.pos && Math.hypot(a.pos.x - x, a.pos.z - z) < 2.6) { far = false; break; }
      }
      if (!far && tries < 18) continue;
    }
    c.tx = x; c.tz = z;
    c.waitUntil = 0;
    return;
  }
  c.waitUntil = now + 4;
}

function unstickCats() {
  for (const c of CATS) {
    if (!isFree(toCell(c.x), toCell(c.z))) {
      const [fx, fz] = nearestFree(toCell(c.x), toCell(c.z));
      c.x = (fx + 0.5) * CELL;
      c.z = (fz + 0.5) * CELL;
      c.tx = undefined;
      if (c._g) c._g.position.set(c.x, 0, c.z);
    }
  }
}

function stepCats() {
  if (!catRoot) return;
  const now = performance.now() / 1000;
  for (const c of CATS) {
    const g = c._g;
    if (!g) continue;

    if (c._drag) { /* 用户正在拖，别动 */ }
    else if (c.waitUntil && now < c.waitUntil) {
      /* 发呆 */
    } else if (c.tx === undefined) {
      pickCatTarget(c);
    } else {
      const dx = c.tx - c.x, dz = c.tz - c.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.18) {
        c.tx = undefined;
        c.waitUntil = now + 2 + Math.random() * 5;
      } else {
        const sp = (c.mood === 'loving' ? 0.62 : 0.42) * (c.s || 1);
        const step = Math.min(d, sp * 0.1);
        const nx = c.x + (dx / d) * step, nz = c.z + (dz / d) * step;
        const R = 0.16 * (c.s || 1);
        const freeAt = (px, pz) => isFree(toCell(px), toCell(pz))
          && isFree(toCell(px + R), toCell(pz)) && isFree(toCell(px - R), toCell(pz))
          && isFree(toCell(px), toCell(pz + R)) && isFree(toCell(px), toCell(pz - R));
        if (freeAt(nx, nz)) {
          c.x = nx; c.z = nz;
          c.rot = Math.atan2(dx, dz);
          g.rotation.y = c.rot;
        } else {
          c.tx = undefined;
        }
      }
    }
    g.position.set(c.x, 0, c.z);
    g.scale.setScalar(c.s || 1);
    // 尾巴/身体轻晃
    const t = performance.now() / 500;
    let bob = Math.sin(t + c.x) * 0.006;
    if (c._hopUntil && now < c._hopUntil) {
      bob += Math.abs(Math.sin((c._hopUntil - now) * 12)) * 0.10;
    }
    g.position.y = bob;

    // 名牌
    if (c._el) {
      tmpV.set(c.x, 0.55 * (c.s || 1) + 0.14, c.z).project(camera);
      c._el.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px';
      c._el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight) + 'px';
      c._el.style.opacity = (tmpV.z < 1 && !window.__EDIT) ? 1 : 0;
    }
  }
}
