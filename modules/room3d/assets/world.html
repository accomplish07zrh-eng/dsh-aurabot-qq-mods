<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/aurabot/api/ext/room3d/assets/OrbitControls.js';

// ------------------------------------------------------------ 基础
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fb6c9, 60, 150);

const ASPECT = () => innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-20, 20, 20, -20, 0.1, 4000);
const ISO = 0.72;                       // 45° 左右俯角
let zoom = 1;
// 支持 ?zoom=1.7 这样直接拉远看全景
try {
  const _z = parseFloat(new URLSearchParams(location.search).get('zoom') || '');
  if (_z > 0) zoom = _z;
} catch (_) {}
function fitView() {
  const a = ASPECT();
  const v = Math.max(44, 52 / Math.max(a, 0.35)) * zoom;
  camera.left = -v * a / 2; camera.right = v * a / 2;
  camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix();
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 2);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.6;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.42;
controls.minZoom = 0.5; controls.maxZoom = 3;
controls.enableZoom = true;
controls.zoomSpeed = 0.8;
camera.position.set(-34, 38, 34);
// 支持 ?rot=90 之类的视角旋转（调试/看全景用）
try {
  const _rot = parseFloat(new URLSearchParams(location.search).get('rot') || '');
  if (!isNaN(_rot)) {
    const off = camera.position.clone().sub(controls.target);
    const ang = _rot * Math.PI / 180;
    const x = off.x * Math.cos(ang) - off.z * Math.sin(ang);
    const z = off.x * Math.sin(ang) + off.z * Math.cos(ang);
    camera.position.set(controls.target.x + x, camera.position.y, controls.target.z + z);
  }
} catch (_) {}
// 支持 ?tx=2&tz=40 把镜头对准某处（调试用）
try {
  const _sp = new URLSearchParams(location.search);
  const _tx = parseFloat(_sp.get('tx') || ''), _tz = parseFloat(_sp.get('tz') || '');
  if (!isNaN(_tx) && !isNaN(_tz)) {
    controls.target.set(_tx, 0, _tz);
    camera.position.set(_tx - 12, 16, _tz + 12);
  }
} catch (_) {}
controls.update();
fitView();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitView(); });

// ------------------------------------------------------------ 光
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x4a5a46, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.45);
sun.position.set(-24, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0006;
scene.add(sun);
const ambient = new THREE.AmbientLight(0xffffff, 0.28);
scene.add(ambient);

// ------------------------------------------------------------ 工具
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.82, metalness: 0.02, ...o });
const box = (w, h, d, m, x, y, z, ry = 0) => {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z); g.rotation.y = ry; g.castShadow = true; g.receiveShadow = true;
  return g;
};
const cyl = (rt, rb, h, m, x, y, z, seg = 16) => {
  const g = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true;
  return g;
};
// 屋顶：四坡顶（庑殿式）用四棱锥近似，加檐口
const tileTextureCache = new Map();
function tileTexture(color) {
  if (tileTextureCache.has(color)) return tileTextureCache.get(color);
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  const c = cv.getContext('2d');
  c.fillStyle = '#' + new THREE.Color(color).getHexString();
  c.fillRect(0, 0, 64, 64);
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 2;
  for (let y = 0; y < 64; y += 8) { c.beginPath(); c.moveTo(0, y); c.lineTo(64, y); c.stroke(); }
  for (let x = 0; x < 64; x += 8) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 64); c.stroke(); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2);
  t.colorSpace = THREE.SRGBColorSpace;
  tileTextureCache.set(color, t);
  return t;
}
function roof(w, d, h, color) {
  const g = new THREE.Group();
  const geo = new THREE.ConeGeometry(Math.hypot(w, d) / 2 * 0.98, h, 4);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0xffffff, map: tileTexture(color), roughness: 0.92, metalness: 0.04
  }));
  m.rotation.y = Math.PI / 4;
  m.castShadow = true; m.receiveShadow = true;
  m.userData.isRoof = true;
  g.add(m);
  const eave = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, 0.16, d * 1.02),
    new THREE.MeshStandardMaterial({ color: 0xffffff, map: tileTexture(color), roughness: .95 }));
  eave.position.y = -h / 2 + 0.06; eave.castShadow = true; eave.userData.isRoof = true;
  g.add(eave);
  // 屋脊
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(w * 1.04, 0.14, 0.22), mat(0x2b343c));
  ridge.position.y = h / 2 - 0.02; ridge.userData.isRoof = true; g.add(ridge);
  return g;
}
// 中空房屋：四面墙 + 地板（屋顶单独加，便于做透视）
function walls(w, h, d, m, t = 0.22) {
  const g = new THREE.Group();
  g.add(box(w, h, t, m, 0, h / 2, -d / 2 + t / 2));
  g.add(box(w, h, t, m, 0, h / 2, d / 2 - t / 2));
  g.add(box(t, h, d, m, -w / 2 + t / 2, h / 2, 0));
  g.add(box(t, h, d, m, w / 2 - t / 2, h / 2, 0));
  g.add(box(w, 0.14, d, m, 0, 0.07, 0));
  return g;
}

// 记录所有建筑的屋顶，供「靠近自动透视」使用
const ROOFS = [];
function regRoof(obj) {
  obj.traverse((o) => {
    if (o.isMesh && o.material && !o.material.transparent) {
      o.material = o.material.clone();
    }
    if (o.isMesh) ROOFS.push(o);
  });
  return obj;
}

// 文字招牌
function sign(text, w = 2.2, h = 0.62, bg = '#2b1d12', fg = '#f0d68a') {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = bg; c.fillRect(0, 0, 512, 128);
  c.strokeStyle = fg; c.lineWidth = 6; c.strokeRect(8, 8, 496, 112);
  c.fillStyle = fg; c.font = 'bold 72px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 256, 68);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  return m;
}

// ------------------------------------------------------------ 海
const seaGeo = new THREE.PlaneGeometry(320, 240, 90, 70);
const seaMat = new THREE.MeshStandardMaterial({
  color: 0x2f6f96, roughness: 0.28, metalness: 0.42, transparent: true, opacity: 0.93,
});
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.rotation.x = -Math.PI / 2;
sea.position.set(0, -0.55, 78);
scene.add(sea);
// 近岸海：一圈跟随岛屿的深色水面，再远就是夜色
const shoreSea = new THREE.Mesh(new THREE.CircleGeometry(84, 64),
  new THREE.MeshStandardMaterial({ color: 0x1b3c52, roughness: 0.42, metalness: 0.5 }));
shoreSea.rotation.x = -Math.PI / 2;
shoreSea.position.y = -0.62;
scene.add(shoreSea);
// 浪花圈
const foam = new THREE.Mesh(new THREE.RingGeometry(39.0, 42.0, 96, 1),
  new THREE.MeshBasicMaterial({ color: 0xdfeaf0, transparent: true, opacity: 0.30 }));
foam.rotation.x = -Math.PI / 2;
foam.position.y = 0.02;
scene.add(foam);
const seaBase = seaGeo.attributes.position.array.slice();
function waveSea(t) {
  const p = seaGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = seaBase[i * 3], y = seaBase[i * 3 + 1];
    p.setZ(i, Math.sin(x * 0.22 + t * 1.1) * 0.28 + Math.cos(y * 0.19 + t * 0.85) * 0.22);
  }
  p.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// ------------------------------------------------------------ 陆地
function groundShape(radius, jitter = 1.6, seed = 3) {
  const pts = [];
  const N = 96;
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = radius + (rnd() - 0.5) * jitter * 2;
    pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
  }
  return new THREE.Shape(pts);
}
const grass = new THREE.Mesh(new THREE.ShapeGeometry(groundShape(38, 2.2, 7)), mat(0x5d7a4a, { roughness: 1 }));
grass.rotation.x = -Math.PI / 2;
grass.position.y = 0;
grass.receiveShadow = true;
scene.add(grass);

// 沙滩环
const sand = new THREE.Mesh(new THREE.RingGeometry(36.0, 41.5, 96, 4), mat(0xd8c49a, { roughness: 1 }));
sand.rotation.x = -Math.PI / 2;
sand.position.y = -0.02;
sand.receiveShadow = true;
scene.add(sand);

// 草地细节：色块
for (let i = 0; i < 26; i++) {
  const r = 6 + Math.random() * 20, a = Math.random() * Math.PI * 2;
  const patch = new THREE.Mesh(new THREE.CircleGeometry(1.2 + Math.random() * 2.6, 12),
    mat(new THREE.Color().setHSL(0.26 + Math.random() * 0.05, 0.32, 0.32 + Math.random() * 0.08)));
  patch.rotation.x = -Math.PI / 2;
  patch.position.set(Math.cos(a) * r, 0.01, Math.sin(a) * r);
  patch.receiveShadow = true;
  scene.add(patch);
}

// ------------------------------------------------------------ 道路
function road(points, width = 2.4, color = 0xb9a884) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0.03, p[1])));
  const seg = 60;
  const geo = new THREE.BufferGeometry();
  const verts = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t);
    const n = new THREE.Vector3(-tan.z, 0, tan.x).normalize().multiplyScalar(width / 2);
    verts.push(p.x - n.x, 0.03, p.z - n.z, p.x + n.x, 0.03, p.z + n.z);
    if (i < seg) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat(color, { roughness: 1 }));
  m.receiveShadow = true;
  scene.add(m);
  return curve;
}
road([[0, 10], [0, 6], [0, 2]]);                 // 家 → 海边
road([[0, 6], [-4, 11], [-8, 14]]);                // 家 → 道观
road([[0, 6], [-10, 9], [-19, 11.4]]);             // 家 → 菜园
road([[0, 6], [8, 7], [14, 5]]);                 // 家 → 小卖部
road([[0, 0], [6, -4], [13, -7]]);               // 家 → 书院
road([[0, 2], [0, 10], [0, 16]]);                // 家 → 码头
road([[11, 6.8], [18, 9], [24, 12.5]]);           // 小卖部 → 灯塔
road([[6, -4], [0, -8], [-10, -10], [-20, -7.6]]); // 家 → 茶馆
road([[0, 15], [7, 18], [13, 18.6]]);             // 码头 → 渔屋

// ------------------------------------------------------------ 建筑：我们的家
function makeHome() {
  const g = new THREE.Group();
  const wall = mat(0xe8e2d4, { roughness: 0.9 });
  const wood = mat(0x7a5334);
  const W = 11, D = 9, H = 3.1;
  g.add(box(W, H, D, wall, 0, H / 2, 0));
  // 地基
  g.add(box(W + 1.0, 0.4, D + 1.0, mat(0x8e8577), 0, 0.2, 0));
  // 屋顶
  const rf = roof(W + 1.2, D + 1.2, 1.7, 0x77869a);
  rf.position.y = H + 1.2;
  g.add(rf);
  // 门
  g.add(box(2.0, 2.3, 0.18, wood, 0, 1.15, D / 2 + 0.02));
  // 窗（夜间发光）
  const winMat = new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xffb757, emissiveIntensity: 0.15, roughness: .5 });
  const wins = [];
  [[-3.4, D / 2 + 0.03], [3.4, D / 2 + 0.03]].forEach(([x, z]) => {
    const w = box(2.2, 1.3, 0.1, winMat, x, 1.85, z);
    wins.push(w); g.add(w);
    g.add(box(2.5, 1.6, 0.12, wood, x, 1.85, z - 0.03));
    g.add(box(2.2, 1.3, 0.08, winMat, x, 1.85, z));
  });
  // 侧面窗
  [-2.2, 2.2].forEach(z => {
    g.add(box(0.1, 1.2, 1.8, winMat, -W / 2 - 0.02, 1.9, z));
    g.add(box(0.1, 1.2, 1.8, winMat, W / 2 + 0.02, 1.9, z));
  });
  // 门廊
  g.add(box(4.2, 0.18, 2.0, mat(0x9a8f7d), 0, 2.55, D / 2 + 1.0));
  [-1.7, 1.7].forEach(x => g.add(cyl(0.11, 0.11, 2.55, wood, x, 1.28, D / 2 + 1.8, 8)));
  // 台阶
  for (let i = 0; i < 3; i++) g.add(box(2.6, 0.16, 0.5, mat(0xb6ad9c), 0, 0.08 + i * 0.16, D / 2 + 0.35 + i * 0.42));
  // 灯笼
  [-2.4, 2.4].forEach(x => {
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), new THREE.MeshStandardMaterial({
      color: 0xff8a5c, emissive: 0xff5a1f, emissiveIntensity: 1.4, roughness: .6
    }));
    l.position.set(x, 2.35, D / 2 + 1.55); g.add(l);
    g.add(cyl(0.03, 0.03, 0.4, mat(0x5a4630), x, 2.7, D / 2 + 1.55, 6));
  });
  g.userData.windows = wins;
  return g;
}
const home = makeHome();
home.position.set(0, 0, -4);
scene.add(home);


// ------------------------------------------------------------ 道观
function makeTemple() {
  const g = new THREE.Group();
  const red = mat(0x9c3a2e, { roughness: .85 });
  const stone = mat(0xb9b3a6);
  // 台基
  g.add(box(11, 0.9, 9, stone, 0, 0.45, 0));
  // 台阶：靠近殿门的那级最高，向外逐级降低（之前写反了）
  for (let i = 0; i < 3; i++)
    g.add(box(3.6, 0.3, 0.62, stone, 0, 0.15 + (2 - i) * 0.3, 4.9 + i * 0.58));
  // 殿身
  g.add(walls(8.4, 3.2, 6.4, red, 0.24).translateY(0.9));
  // 室内：神像 + 供桌 + 蒲团 + 烛台
  const shrine = new THREE.Group();
  shrine.add(box(3.0, 0.9, 1.1, mat(0x6b3a2a), 0, 0.45, -1.6));            // 供桌
  const idol = new THREE.Group();
  idol.add(cyl(0.34, 0.42, 1.0, mat(0xd8b46a), 0, 0.5, 0, 10));             // 身
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 8), mat(0xe8c87a));
  head.position.y = 1.12; idol.add(head);
  idol.position.set(0, 0.9, -2.15); shrine.add(idol);
  [-0.9, 0.9].forEach(dx => {
    shrine.add(cyl(0.06, 0.08, 0.5, mat(0xc8a04a), dx, 1.15, -1.35, 8));    // 烛台
    const flame = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0xff8a1f, emissiveIntensity: 2 }));
    flame.position.set(dx, 1.45, -1.35); shrine.add(flame);
  });
  [[0, 0.6], [0.7, -0.2], [-0.7, -0.2]].forEach(([dx, dz]) => {
    shrine.add(cyl(0.3, 0.3, 0.12, mat(0xb5473c), dx, 0.06, dz + 0.6, 12)); // 蒲团
  });
  shrine.position.y = 0.9;
  g.add(shrine);
  // 柱
  [-3.6, -1.8, 0, 1.8, 3.6].forEach(x => {
    g.add(cyl(0.16, 0.16, 3.2, mat(0x7d2b22), x, 0.9 + 1.6, 3.3, 10));
  });
  // 屋顶（重檐）
  const r1 = roof(9.2, 7.4, 1.7, 0x6d7d92); r1.position.y = 0.9 + 3.2 + 1.1; g.add(r1);
  const r2 = roof(6.6, 5.4, 1.2, 0x5f6f84); r2.position.y = 0.9 + 3.2 + 2.9; g.add(r2);

  // 香炉
  const burner = cyl(0.55, 0.75, 1.0, mat(0x6b6156), 0, 1.4, 5.6, 12);
  g.add(burner);
  const smoke = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.22, 1.6, 6, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 }));
  smoke.position.set(0, 3.4, 5.6); g.add(smoke);
  g.userData.smoke = smoke;
  return g;
}
const temple = makeTemple();
temple.position.set(-8.5, 0, 17.2);
temple.rotation.y = Math.PI * 0.08;
scene.add(temple);

// ------------------------------------------------------------ 书院
function makeAcademy() {
  const g = new THREE.Group();
  const wood = mat(0x8a6844);
  const wall = mat(0xe6dfcf);
  g.add(box(12, 0.5, 8, mat(0xa89f8d), 0, 0.25, 0));
  g.add(walls(10.4, 2.9, 6.4, wall, 0.24).translateY(0.5));
  const lib = new THREE.Group();
  lib.add(box(4.2, 0.92, 1.6, mat(0x6d4f30), 0, 0.46, -2.2));               // 讲台
  lib.add(box(1.0, 0.1, 0.7, mat(0x8a6642), 0, 0.98, -2.2));
  // 书架
  [-3.6, 3.6].forEach(dx => {
    lib.add(box(1.8, 2.1, 0.5, mat(0x7a5a38), dx, 1.05, -2.6));
    for (let i = 0; i < 3; i++) lib.add(box(1.6, 0.06, 0.44, mat(0x9a7a52), dx, 0.55 + i * 0.6, -2.6));
  });

function makeShipName(text, w = 7, h = 1.6) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 256;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, 1024, 256);
  c.font = 'bold 150px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 10; c.strokeStyle = 'rgba(20,30,40,.55)';
  c.strokeText(text, 512, 130);
  const grad = c.createLinearGradient(0, 40, 0, 210);
  grad.addColorStop(0, '#ffe9b0'); grad.addColorStop(1, '#e0ac48');
  c.fillStyle = grad;
  c.fillText(text, 512, 130);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
}

function makeCruise() {
  const g = new THREE.Group();
  const hullMat = mat(0xf2f4f6);
  const darkMat = mat(0x2c3e50);
  const deckMat = mat(0xe8eef2);
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x9fd4ea, roughness: 0.18, metalness: 0.5,
    emissive: 0x3a7f9a, emissiveIntensity: 0.25,
  });

  const L = 24, W = 7;                    // 船长 / 船宽

  // 船体：主体 + 船头尖
  g.add(box(L - 4, 3.0, W, hullMat, 0, 1.5, 0));
  const bow = new THREE.Mesh(new THREE.ConeGeometry(W / 2, 5.2, 4), hullMat);
  bow.rotation.z = -Math.PI / 2; bow.rotation.y = Math.PI / 4;
  bow.scale.set(1, 1, 0.9);
  bow.position.set((L - 4) / 2 + 2.0, 1.5, 0);
  g.add(bow);
  // 船尾圆角
  const stern = new THREE.Mesh(new THREE.CylinderGeometry(W / 2, W / 2, 3.0, 16, 1, false, 0, Math.PI), hullMat);
  stern.rotation.z = Math.PI / 2; stern.rotation.y = Math.PI / 2;
  stern.position.set(-(L - 4) / 2, 1.5, 0);
  g.add(stern);

  // 吃水线（深色带）
  g.add(box(L - 4, 0.9, W + 0.06, darkMat, 0, 0.45, 0));

  // 甲板层（3 层，逐层收窄）
  const decks = [
    { w: L - 6, d: W - 0.8, h: 2.4, y: 4.2 },
    { w: L - 9, d: W - 1.6, h: 2.2, y: 6.5 },
    { w: L - 12, d: W - 2.4, h: 2.0, y: 8.6 },
  ];
  decks.forEach((d, i) => {
    g.add(box(d.w, d.h, d.d, deckMat, 0, d.y, 0));
    // 舷窗前的一圈亮线
    g.add(box(d.w + 0.04, 0.08, d.d + 0.04, mat(0xffffff), 0, d.y + d.h / 2 - 0.15, 0));
    // 两舷的窗
    const rows = Math.floor(d.w / 1.25);
    for (let k = 0; k < rows; k++) {
      const px = -d.w / 2 + 0.7 + k * 1.25;
      [-1, 1].forEach((side) => {
        g.add(box(0.62, 0.5, 0.06, glassMat, px, d.y + 0.15, side * (d.d / 2 + 0.02)));
      });
    }
    // 栏杆
    [-1, 1].forEach((side) => {
      g.add(box(d.w, 0.06, 0.06, mat(0xffffff), 0, d.y + d.h / 2 + 0.7, side * (d.d / 2 - 0.05)));
      for (let k = 0; k <= 6; k++) {
        g.add(cyl(0.03, 0.03, 0.7, mat(0xffffff),
          -d.w / 2 + k * (d.w / 6), d.y + d.h / 2 + 0.35, side * (d.d / 2 - 0.05), 5));
      }
    });
  });

  // 驾驶室（最上层前端）
  g.add(box(3.2, 1.5, W - 3.4, hullMat, (L - 12) / 2 - 3.4, 10.3, 0));
  g.add(box(2.8, 0.7, W - 3.8, glassMat, (L - 12) / 2 - 3.4, 10.55, 0));

  // 烟囱（两根，红白）
  [-1, 1].forEach((side) => {
    const x = -3.5 + side * 0;
    const fy = 11.4;
    g.add(cyl(0.75, 0.85, 2.6, mat(0xd8dde2), 2.2, fy, side * 1.3, 12));
    g.add(cyl(0.78, 0.78, 0.5, mat(0xc0392b), 2.2, fy + 1.1, side * 1.3, 12));
    g.add(cyl(0.62, 0.62, 0.24, mat(0x333a40), 2.2, fy + 1.5, side * 1.3, 12));
  });

  // 救生艇（两舷橙色小艇）
  for (let i = 0; i < 3; i++) {
    [-1, 1].forEach((side) => {
      const bx = -5 + i * 5;
      const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 1.5, 3, 8), mat(0xe8622a));
      b.rotation.z = Math.PI / 2;
      b.position.set(bx, 5.6, side * (W / 2 + 0.35));
      g.add(b);
    });
  }

  // 船名（两舷）
  [[-1, 1], [-1, -1]].forEach(([, side]) => {
    const nm = makeShipName('小小柒号', 9, 1.9);
    nm.position.set(-2.0, 2.15, side * (W / 2 + 0.06));
    nm.rotation.y = side > 0 ? 0 : Math.PI;
    g.add(nm);
  });
  // 船头小旗
  g.add(cyl(0.06, 0.06, 2.4, mat(0xdddddd), (L - 4) / 2 + 1.6, 4.0, 0, 6));
  const flag = box(1.0, 0.62, 0.04, mat(0xd64545), (L - 4) / 2 + 2.1, 4.9, 0);
  g.add(flag);

  // 甲板灯（夜里亮）
  const shipLamps = [];
  for (let i = 0; i < 8; i++) {
    const lp = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0xfff3c8, emissive: 0xffd27a, emissiveIntensity: 1.2 }));
    lp.position.set(-9 + i * 2.6, 10.0, (i % 2 ? 1 : -1) * (W / 2 - 1.2));
    g.add(lp); shipLamps.push(lp);
  }
  g.userData.lamps = shipLamps;
  return g;
}

function makeBackyard() {
  const g = new THREE.Group();
  const wood = mat(0x8a6a44), stone = mat(0xa9a49a);

  // 篱笆（矩形围出后院，南边留门）
  const fx0 = -8.5, fx1 = 8.5, fz0 = -10.5, fz1 = -18.5;
  const post = (x, z) => {
    const p = cyl(0.07, 0.09, 1.0, wood, x, 0.5, z, 6); g.add(p);
  };
  for (let x = fx0; x <= fx1; x += 1.2) { post(x, fz0); post(x, fz1); }
  for (let z = fz1; z <= fz0; z += 1.2) { post(fx0, z); post(fx1, z); }
  const rail = (w, d, x, z) => g.add(box(w, 0.07, d, wood, x, 0.72, z));
  rail(fx1 - fx0, 0.06, 0, 0.72 - 0.0, (fz1 + fz0) / 2);   // 占位（下面重画）
  g.children.pop();
  g.add(box(fx1 - fx0, 0.07, 0.06, wood, 0, 0.72, fz1));
  g.add(box(fx1 - fx0, 0.07, 0.06, wood, 0, 0.72, fz0));
  g.add(box(0.06, 0.07, fz0 - fz1, wood, fx0, 0.72, (fz1 + fz0) / 2));
  g.add(box(0.06, 0.07, fz0 - fz1, wood, fx1, 0.72, (fz1 + fz0) / 2));

  // 石桌 + 石凳
  const tx = -4.2, tz = -13.6;
  g.add(cyl(0.95, 1.0, 0.14, stone, tx, 0.78, tz, 16));
  g.add(cyl(0.22, 0.3, 0.72, stone, tx, 0.4, tz, 10));
  [[-1.9, 0], [1.9, 0], [0, -1.9], [0, 1.9]].forEach(([dx, dz]) => {
    g.add(cyl(0.34, 0.38, 0.42, stone, tx + dx, 0.21, tz + dz, 10));
  });

  // 竹林
  for (let i = 0; i < 26; i++) {
    const bx = 4.2 + (Math.random() - 0.5) * 4.4;
    const bz = -15.2 + (Math.random() - 0.5) * 4.0;
    const h = 3.2 + Math.random() * 2.2;
    const stalk = cyl(0.055, 0.07, h, mat(0x8fae5a), bx, h / 2, bz, 6);
    g.add(stalk);
    for (let k = 0; k < 3; k++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.1, 5),
        mat(0x4e7a3a, { roughness: 1 }));
      leaf.position.set(bx + (Math.random() - 0.5) * 0.7, h * (0.55 + k * 0.16), bz + (Math.random() - 0.5) * 0.7);
      leaf.rotation.z = (Math.random() - 0.5) * 0.5;
      leaf.castShadow = true;
      g.add(leaf);
    }
  }

  // 晾衣绳
  const lx0 = -7.0, lx1 = -3.0, lz = -16.4;
  g.add(cyl(0.06, 0.07, 1.9, wood, lx0, 0.95, lz, 6));
  g.add(cyl(0.06, 0.07, 1.9, wood, lx1, 0.95, lz, 6));
  g.add(box(lx1 - lx0, 0.02, 0.02, mat(0xd8d2c4), (lx0 + lx1) / 2, 1.82, lz));
  const cloths = [0xdfe8f2, 0xf2dede, 0xe8f2de, 0xf6efe0];
  for (let i = 0; i < 4; i++) {
    const c = box(0.62, 0.8 + Math.random() * 0.25, 0.03, mat(cloths[i]),
      lx0 + 0.7 + i * 0.95, 1.4, lz);
    g.add(c);
  }

  // 鸡舍 + 三只鸡

function famSetClip(a, kind) {
  const d = a.group.userData;
  const k = d.texes[kind] ? kind : 'idle';
  const tex = d.texes[k];
  if (d.plane.material.map !== tex) {
    d.plane.material.map = tex;
    d.plane.material.needsUpdate = true;
    Object.values(d.videos).forEach(v => v.pause());
    d.videos[k].play().catch(() => {});
  }
}

function famPickSpot() {
  const h = new Date().getHours();
  if (h >= 22 || h < 6) return { name: '在家睡觉', node: 'home', x: 0, z: -1, act: 'sleep', indoor: true };
  return SPOTS[Math.floor(Math.random() * SPOTS.length)];
}

function famPlan(a) {
  const g = a.group;
  const spot = famPickSpot();
  const from = nearestNode(g.position.x, g.position.z);
  const nodes = findPath(from, spot.node).slice(1).map(k => ({ x: NODES[k][0], z: NODES[k][1] }));
  const [sx, sz] = pushOut(spot.x, spot.z);
  nodes.push({ x: sx, z: sz });
  a.path = nodes;
  a.spot = spot;
  a.mode = 'walk';
  famSetClip(a, 'walk');
}

function famTick(a, dt, t) {
  const g = a.group;
  const d = g.userData;
  if (a.mode === 'walk') {
    const p = a.path[0];
    if (!p) {
      a.mode = 'act';
      a.timer = 4 + Math.random() * 6;
      famSetClip(a, (a.spot && a.spot.act) || 'idle');
      if (a.spot && a.spot.indoor) { g.visible = false; a.indoor = true; }
      return;
    }
    const dx = p.x - g.position.x, dz = p.z - g.position.z;
    const dist = Math.hypot(dx, dz);
    const spd = 1.5;
    if (dist < 0.1) { a.path.shift(); return; }
    let nx = g.position.x + (dx / dist) * spd * dt;
    let nz = g.position.z + (dz / dist) * spd * dt;
    [nx, nz] = pushOut(nx, nz);
    g.position.x = nx; g.position.z = nz;
    g.position.y = Math.abs(Math.sin(t * 8.5)) * 0.045;
    d.plane.quaternion.copy(camera.quaternion);
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    d.plane.scale.x = (dx * camRight.x + dz * camRight.z) >= 0 ? 1 : -1;
  } else if (a.mode === 'act') {
    a.timer -= dt;
    if (a.timer <= 0) { a.mode = 'idle'; famSetClip(a, 'idle'); }
  } else {
    a.timer -= dt;
    if (a.timer <= 0) {
      a.timer = 10 + Math.random() * 14;
      if (a.indoor && new Date().getHours() > 7) { a.indoor = false; g.visible = true; }
      famPlan(a);
    }
  }
  d.shadow.scale.setScalar(1 + Math.sin(t * 3 + a.name.length) * 0.04);
}

const famTmp = new THREE.Vector3();
function famTickLabels() {
  for (const a of famActors) {
    const d = a.group.userData;

// 轴对齐矩形近似（含屋檐外扩），角色被推进来就朝最近的方向推出去
const OBSTACLES = [
  { x: 0,    z: -4,   hw: 6.2, hd: 5.2 },   // 家（含门廊）
  { x: -8.5, z: 17.2, hw: 6.0, hd: 5.2 },   // 道观
  { x: 14,   z: -8,   hw: 6.4, hd: 4.4 },   // 鹿门书院
  { x: 13,   z: 6,    hw: 3.4, hd: 2.6 },   // 小卖部
  { x: -21,  z: -9,   hw: 5.0, hd: 3.9 },   // 海边茶馆
  { x: 13,   z: 21,   hw: 3.4, hd: 2.9 },   // 渔屋
];
const CHAR_R = 0.55;                        // 角色半径

function pushOut(x, z) {
  for (const o of OBSTACLES) {
    const dx = x - o.x, dz = z - o.z;
    const ox = o.hw + CHAR_R - Math.abs(dx);
    const oz = o.hd + CHAR_R - Math.abs(dz);
    if (ox > 0 && oz > 0) {
      // 沿穿透较浅的轴推出去
      if (ox < oz) x = o.x + Math.sign(dx || 1) * (o.hw + CHAR_R);
      else z = o.z + Math.sign(dz || 1) * (o.hd + CHAR_R);
    }
  }
  // 灯塔（圆形）
  const lx = x - 26, lz = z - 14, lr = 2.4 + CHAR_R;
  const ld = Math.hypot(lx, lz);
  if (ld < lr) { x = 26 + (lx / (ld || 1)) * lr; z = 14 + (lz / (ld || 1)) * lr; }
  return [x, z];
}

const NODES = {
  home:    [0, 1.8],
  well:    [4.6, 2.2],
  junc:    [0, 6.0],
  south:   [0, 10.5],
  dock:    [0, 15.0],

  midacc:  [6.0, -4.0],

  beach:   [3.2, 10.8],
  light:   [24.0, 12.5],
  tea:     [-20.0, -7.6],
  hut:     [13.0, 18.6],
};
const EDGES = [
  ['home', 'well'], ['home', 'junc'], ['well', 'junc'],
  ['junc', 'south'], ['south', 'dock'], ['south', 'beach'],
  ['junc', 'garden'], ['junc', 'temple'], ['junc', 'shop'],
  ['home', 'midacc'], ['midacc', 'academy'],
  ['shop', 'light'], ['academy', 'tea'], ['midacc', 'tea'],
  ['dock', 'hut'], ['shop', 'hut'],
];
const ADJ = {};
for (const [a, b] of EDGES) {
  (ADJ[a] = ADJ[a] || []).push(b);
  (ADJ[b] = ADJ[b] || []).push(a);
}
function nearestNode(x, z) {
  let best = 'home', bd = 1e9;
  for (const k in NODES) {
    const d = Math.hypot(NODES[k][0] - x, NODES[k][1] - z);
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}
function findPath(fromKey, toKey) {
  if (fromKey === toKey) return [fromKey];
  const prev = { [fromKey]: null };
  const q = [fromKey];
  while (q.length) {
    const cur = q.shift();
    for (const nb of (ADJ[cur] || [])) {
      if (nb in prev) continue;
      prev[nb] = cur;
      if (nb === toKey) {
        const path = [nb];
        let p = cur;
        while (p) { path.unshift(p); p = prev[p]; }
        return path;
      }
      q.push(nb);
    }
  }
  return [fromKey];
}

let qpos = [];          // 剩余路点
let target = null;      // 最终目的地
let mode = 'idle';
let actTimer = 0;
let nextThink = 3;
let indoor = false;

function setClip(kind) {
  const d = hero.userData;
  const tex = d.texes[kind] || d.texes.idle;
  if (d.plane.material.map !== tex) {
    d.plane.material.map = tex;
    d.plane.material.needsUpdate = true;
    Object.values(d.videos).forEach(v => v.pause());
    const v = d.videos[kind] || d.videos.idle;
    v.play().catch(() => {});
  }
}

function pickSpot() {
  const h = new Date().getHours();
  if (h >= 22 || h < 6) return SLEEP_SPOT;
  return SPOTS[Math.floor(Math.random() * SPOTS.length)];
}

function planRoute(spot) {
  const from = nearestNode(hero.position.x, hero.position.z);
  const path = findPath(from, spot.node);
  qpos = path.slice(1).map(k => ({ x: NODES[k][0], z: NODES[k][1] }));
  const [sx, sz] = pushOut(spot.x, spot.z);
  qpos.push({ x: sx, z: sz });
  target = spot;
  mode = 'walk';
  setClip('walk');
  whereEl.textContent = '正在去' + spot.name.replace(/^在/, '');
}

function tickHero(dt, t) {
  const d = hero.userData;
  if (mode === 'walk') {
    const nextPt = qpos[0];
    if (!nextPt) {
      mode = 'act';
      actTimer = 3 + Math.random() * 6;
      setClip(target.act || 'idle');
      whereEl.textContent = target.name;
      logEvent((target.act === 'eat' ? '吃了点东西' :
                target.act === 'read' ? '看了会儿书' :
                target.act === 'play' ? '逛了逛' :
                target.act === 'sleep' ? '睡着了' : '待了一会儿'),
               target.name.replace(/^在/, ''));
      if (target.indoor && !indoor) {
        indoor = true;
        hero.visible = false;                 // 进屋了，外面看不见
        nameTag.style.display = 'none';
      }
      return;
    }
    const dx = nextPt.x - hero.position.x, dz = nextPt.z - hero.position.z;
    const dist = Math.hypot(dx, dz);
    const speed = 1.7;
    if (dist < 0.1) {
      qpos.shift();
    } else {
      let nx = hero.position.x + (dx / dist) * speed * dt;
      let nz = hero.position.z + (dz / dist) * speed * dt;
      [nx, nz] = pushOut(nx, nz);
      hero.position.x = nx;
      hero.position.z = nz;
      hero.position.y = Math.abs(Math.sin(t * 9)) * 0.05;
      // 纸片人：始终正对相机（否则侧面看是一条线）
      d.plane.quaternion.copy(camera.quaternion);
      // 用左右翻转来表示朝左/朝右
      const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      const side = (dx * camRight.x + dz * camRight.z) >= 0 ? 1 : -1;
      d.plane.scale.x = side;
    }
  } else if (mode === 'act') {
    actTimer -= dt;
    if (actTimer <= 0) { mode = 'idle'; setClip('idle'); }
  } else {
    nextThink -= dt;
    if (nextThink <= 0) {
      nextThink = 8 + Math.random() * 10;
      planRoute(pickSpot());
    }
  }
  d.shadow.scale.setScalar(1 + Math.sin(t * 3) * 0.04);
}

  const bot = new THREE.Color().setHSL(0.56, 0.45, 0.12 + day * 0.30);
  skyMat.uniforms.top.value.copy(top);
  skyMat.uniforms.bottom.value.copy(bot);
  scene.background = null;
  // 灯
  const lampOn = night > 0.35 || weather === 'rain';
  lampLights.forEach(l => { l.intensity = lampOn ? 1.05 : 0; });
  home.userData.windows.forEach(w => { w.material.emissiveIntensity = lampOn ? 1.15 : 0.12; });
  // 云
  clouds.forEach(c => {
    c.position.x += c.userData.speed * 0.16;
    if (c.position.x > 70) c.position.x = -70;
    c.visible = weather === 'cloudy' || weather === 'rain' || weather === 'fog';

  trees.forEach(tr => { tr.rotation.z = Math.sin(t * 0.8 + tr.userData.sway) * 0.012 * (weather === 'rain' ? 3 : 1); });
}

const ROOM_DEFS = {
  '道观':     { pos: [-8.5, 0, 17.2], spot: [-8.5, 0, 15.8], zoom: 2.0 },
  '鹿门书院': { pos: [14, 0, -8],     spot: [14, 0, -6.0],   zoom: 2.0 },

};

function setRoofOpacity(group, v) {
  for (const m of (group.userData.roofs || [])) {
    if (!m.material.transparent) { m.material = m.material.clone(); m.material.transparent = true; }
    m.material.opacity = v;
    m.material.depthWrite = v > 0.5;

}

  target = { name: '在' + name + '里', act: 'idle' };
  setClip('idle');
  whereEl.textContent = '在' + name + '里';
  exitBtn.style.display = 'block';
  logEvent('进去了', name);
}

function exitBuilding() {
  if (!insideName) return;
  setRoofOpacity(GROUPS[insideName], 1);
  insideName = '';
  controls.target.copy(savedCam.target);
  zoom = savedCam.zoom;
  fitView();
  camera.position.copy(savedCam.pos);
  controls.update();
  mode = 'idle';
  nextThink = 1;
  exitBtn.style.display = 'none';
  logEvent('出来了', insideName || '');
}

// 把可进入建筑的气泡变成按钮
for (const it of placeLabels) {
  const nm = it.el.textContent;
  if (ROOM_DEFS[nm]) {
    it.el.style.pointerEvents = 'auto';
    it.el.style.cursor = 'pointer';
    it.el.title = '点击进入' + nm;
    it.el.onclick = (e) => { e.stopPropagation(); enterBuilding(nm); };
    it.el.onmouseenter = () => { it.el.style.background = '#ffe9b0'; };
    it.el.onmouseleave = () => { it.el.style.background = 'rgba(250,250,252,.94)'; };
  }
}

const exitBtn = document.createElement('button');
exitBtn.textContent = '离开这里';
exitBtn.style.cssText = 'position:fixed;right:14px;bottom:74px;z-index:10;padding:9px 15px;' +
  'border-radius:11px;border:1px solid rgba(255,255,255,.22);background:#ffcf72;color:#20160a;' +
  'font-size:13px;font-weight:600;cursor:pointer;display:none';
exitBtn.onclick = exitBuilding;
document.body.appendChild(exitBtn);

// ------------------------------------------------------------ 名字牌跟随
const tmpV = new THREE.Vector3();
function faceCamera() {
  const d = hero.userData;
  if (!d || !d.plane) return;
  d.plane.quaternion.copy(camera.quaternion);
}

function tickTag() {
  tmpV.set(hero.position.x, CHAR_H + 0.85, hero.position.z);
  tmpV.project(camera);
  const x = (tmpV.x * 0.5 + 0.5) * innerWidth;
  const y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
  nameTag.style.left = x + 'px';
  nameTag.style.top = y + 'px';
  nameTag.style.display = (indoor || !hero.visible) ? 'none' : 'block';
}

// ------------------------------------------------------------ 主循环
applyWeather('clear');
const clock = new THREE.Clock();
let acc = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  acc += dt;
  if (acc > 1 / 40) { acc = 0; }
  waveSea(t);
  tickHero(dt, t);
  for (const a of famActors) famTick(a, dt, t);
  famTickLabels();
  faceCamera();
  tickSky(t);
  tickRain(dt);
  tickTag();
  tickPlaceLabels();
  if (temple.userData.smoke) temple.userData.smoke.position.y = 3.4 + Math.sin(t * 0.7) * 0.12;
  controls.update();
  renderer.render(scene, camera);
}
loop();
setTimeout(() => document.getElementById('loading').classList.add('hide'), 600);
</script>
</body>
</html>
