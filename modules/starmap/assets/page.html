<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星图 · Aurabot 记忆</title>
<style>
  :root{ --fg:#e6edff; --dim:#6d7a9c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#040a18;color:var(--fg);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #cv{position:fixed;inset:0;display:block;cursor:grab}
  #cv.grabbing{cursor:grabbing}

  .glass{
    background:linear-gradient(180deg,rgba(12,24,48,.72),rgba(7,14,30,.62));
    border:1px solid rgba(130,180,255,.14);
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(160,200,255,.07);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }

  #brand{position:fixed;left:26px;top:22px;z-index:10;pointer-events:none}
  #brand h1{margin:0;font-size:17px;font-weight:500;letter-spacing:.42em;
    color:#e2ecff;text-shadow:0 0 26px rgba(120,180,255,.65)}
  #brand p{margin:8px 0 0;font-size:11.5px;color:var(--dim);letter-spacing:.08em}

  #legend{position:fixed;left:26px;bottom:24px;z-index:10;pointer-events:none;
    display:flex;gap:16px;font-size:11.5px;color:#8092b8;letter-spacing:.04em}
  #legend span{display:inline-flex;align-items:center;gap:6px}
  #legend i{width:7px;height:7px;border-radius:50%;background:currentColor;
    box-shadow:0 0 10px currentColor}

  #hint{position:fixed;right:26px;bottom:24px;z-index:10;pointer-events:none;
    font-size:11px;color:#54607d;text-align:right;line-height:1.9;letter-spacing:.04em}

  #bar{position:fixed;right:26px;top:22px;z-index:12;display:flex;gap:8px;align-items:center}
  #q{width:210px;padding:8px 13px;border-radius:999px;font-size:12.5px;color:var(--fg);
    outline:none;background:rgba(8,18,36,.7);border:1px solid rgba(130,180,255,.16);
    backdrop-filter:blur(12px);transition:.2s}
  #q::placeholder{color:#4f5b78}
  #q:focus{border-color:rgba(130,180,255,.5);box-shadow:0 0 0 3px rgba(80,150,255,.12)}
  #bar button{padding:8px 14px;border-radius:999px;cursor:pointer;font-size:11.5px;
    color:#8fa3c8;background:rgba(8,18,36,.7);border:1px solid rgba(130,180,255,.16);
    backdrop-filter:blur(12px);transition:.2s}
  #bar button:hover{color:#e2ecff;border-color:rgba(130,180,255,.45)}

  #panel{position:fixed;z-index:11;right:26px;top:76px;width:392px;
    max-height:calc(100vh - 140px);overflow:auto;padding:22px 24px;border-radius:18px;
    transform:translateX(120%);transition:transform .32s cubic-bezier(.4,0,.2,1);
    pointer-events:auto}
  #panel.open{transform:translateX(0)}
  #panel h2{margin:0 0 10px;font-size:15px;font-weight:500;line-height:1.65;color:#eef5ff;letter-spacing:.02em}
  #panel .meta{font-size:11px;color:#6d7a9c;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px}
  #panel .meta b{font-weight:500;color:#8ab4ff}
  #panel .body{font-size:12.5px;line-height:2.05;color:#bccae4;white-space:pre-wrap;word-break:break-word}
  #panel .x{position:absolute;right:16px;top:14px;cursor:pointer;color:#4d5877;font-size:17px;
    width:24px;height:24px;line-height:22px;text-align:center;border-radius:50%;transition:.2s}
  #panel .x:hover{color:#e2ecff;background:rgba(130,180,255,.12)}

  #tip{position:fixed;z-index:13;pointer-events:none;padding:7px 11px;border-radius:9px;
    font-size:12px;color:#eaf2ff;white-space:nowrap;opacity:0;transition:opacity .14s;
    background:rgba(8,18,36,.92);border:1px solid rgba(130,180,255,.2);
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #tip.on{opacity:1}

  #boot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:#040a18;color:#5f6d8f;font-size:12.5px;letter-spacing:.34em}
  #boot.gone{opacity:0;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="brand">
  <h1>星 图</h1>
  <p>每一颗星，都是一个记住的瞬间</p>
</div>

<div id="legend">
  <span style="color:#6ee7a8"><i></i>项目</span>
  <span style="color:#7ec2ff"><i></i>资料</span>
  <span style="color:#c9a2ff"><i></i>关于老爹</span>
  <span style="color:#ff8ecf"><i></i>日常</span>
  <span style="color:#ffd166"><i></i>会话</span>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 点击查看<br>右键平移 · 双击复位 · 空格停转</div>

<div id="bar">
  <input id="q" type="search" placeholder="搜索记忆…" autocomplete="off" />
  <button id="resetBtn">复位</button>
</div>

<div id="panel" class="glass">
  <div class="x" id="closeBtn">✕</div>
  <h2 id="pTitle">—</h2>
  <div class="meta" id="pMeta"></div>
  <div class="body" id="pBody"></div>
</div>

<div id="tip"></div>
<div id="boot">正在展开星图</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', {alpha:false});
  const panel = document.getElementById('panel');
  const pTitle = document.getElementById('pTitle');
  const pMeta = document.getElementById('pMeta');
  const pBody = document.getElementById('pBody');
  const tip = document.getElementById('tip');
  const boot = document.getElementById('boot');
  const q = document.getElementById('q');
  const TAU = Math.PI*2;

  // 星体色（偏蓝白，和参考图一致）；类型色只做轻微染色
  const TYPE_TINT = {
    project:[150,235,195], reference:[150,200,255], user:[205,175,255],
    daily:[255,175,215], session:[255,220,150], note:[180,195,220], feedback:[255,205,160]
  };
  const TYPE_CN = {project:'项目',reference:'资料',user:'关于老爹',daily:'日常',
    session:'会话',note:'其他',feedback:'反馈'};

  let W=0,H=0,DPR=1;
  let nodes=[], links=[];
  let yaw=.55, pitch=-.22, zoom=1, panX=0, panY=0;
  let dragging=false, mode=0, lx=0, ly=0, moved=0;
  let auto=true, hover=null, sel=null, filter='';
  let bgCanvas=null, starLayers=[];

  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildBackground();
  }
  addEventListener('resize', resize);

  // ---------------- 背景：深空星野 + 银河带 ----------------
  function buildBackground(){
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W; bgCanvas.height = H;
    const c = bgCanvas.getContext('2d');

    // 近乎全黑的底
    const g0 = c.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.85);
    g0.addColorStop(0,'#06070f'); g0.addColorStop(.55,'#03040a'); g0.addColorStop(1,'#010207');
    c.fillStyle=g0; c.fillRect(0,0,W,H);

    // 银河带：从左下到右上的斜带
    const ang = -0.62;
    const cx = W*.62, cy = H*.44;
    const L = Math.max(W,H)*1.05;

    c.save();
    c.translate(cx,cy); c.rotate(ang);

    // 紫色基底光
    for(let i=0;i<80;i++){
      const t = Math.random()*2-1;
      const x = t*L*.85;
      const spread = L*.19*(1-Math.abs(t)*.30);
      const y = (Math.random()*2-1)*spread*.6;
      const r = L*(.05+Math.random()*.15);
      const mix = Math.random();
      const col = mix<.42 ? [186,92,150] : mix<.74 ? [146,92,196] : [96,112,206];
      const g = c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${(.07+Math.random()*.13).toFixed(3)})`);
      g.addColorStop(.45,`rgba(${col[0]},${col[1]},${col[2]},${(.03+Math.random()*.05).toFixed(3)})`);
      g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }

    // 粉白亮核
    for(let i=0;i<12;i++){
      const t=(Math.random()*2-1)*.82;
      const x=t*L*.8, y=(Math.random()*2-1)*L*.055;
      const r=L*(.018+Math.random()*.052);
      const g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(255,208,232,.46)');
      g.addColorStop(.28,'rgba(246,138,190,.18)');
      g.addColorStop(.65,'rgba(210,110,180,.06)');
      g.addColorStop(1,'rgba(210,110,180,0)');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }

    // 暗尘埃带：用很多小软团叠出不规则遮挡，避免硬边黑块
    c.globalCompositeOperation='source-over';
    for(let i=0;i<22;i++){
      const cx0=(Math.random()*2-1)*L*.78;
      const cy0=(Math.random()*2-1)*L*.035;
      const len=L*(.05+Math.random()*.14);
      const blobs=6+Math.round(Math.random()*6);
      for(let k=0;k<blobs;k++){
        const x=cx0+(Math.random()*2-1)*len*.5;
        const y=cy0+(Math.random()*2-1)*L*.014;
        const r=L*(.006+Math.random()*.020);
        const g=c.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,'rgba(2,2,7,.26)');
        g.addColorStop(.55,'rgba(2,2,7,.13)');
        g.addColorStop(1,'rgba(2,2,7,0)');
        c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
      }
    }
    c.restore();

    // 密星野
    const nStars = Math.round(W*H/1100);
    for(let i=0;i<nStars;i++){
      const x=Math.random()*W, y=Math.random()*H;
      const big = Math.random()>.93;
      const r = big ? .9+Math.random()*1.3 : .2+Math.random()*.75;
      const a = .12+Math.random()*.72;
      c.fillStyle=`rgba(${224+(Math.random()*24|0)},${231+(Math.random()*20|0)},255,${a.toFixed(3)})`;
      c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
    }
    // 少量亮星带光晕（叠加发光，避免灰圆）
    c.globalCompositeOperation='lighter';
    for(let i=0;i<Math.round(W*H/120000);i++){
      const x=Math.random()*W, y=Math.random()*H, r=.9+Math.random()*.9;
      const g=c.createRadialGradient(x,y,0,x,y,r*6);
      g.addColorStop(0,'rgba(255,255,255,.75)');
      g.addColorStop(.18,'rgba(210,230,255,.30)');
      g.addColorStop(.55,'rgba(170,200,255,.07)');
      g.addColorStop(1,'rgba(150,185,255,0)');
      c.fillStyle=g; c.beginPath(); c.arc(x,y,r*6,0,TAU); c.fill();
    }
    c.globalCompositeOperation='source-over';

    // 暗角
    const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.30,W/2,H/2,Math.max(W,H)*.82);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.72)');
    c.fillStyle=vg; c.fillRect(0,0,W,H);

    // 动态闪烁层（只留少量小星）
    starLayers = [
      {n:Math.round(W*H/26000), r:[.35,.8],  a:[.10,.28], sp:.5, spark:.12, list:[]}
    ];
    for(const L2 of starLayers){
      for(let i=0;i<L2.n;i++){
        L2.list.push({
          x:Math.random()*W, y:Math.random()*H,
          r:L2.r[0]+Math.random()*(L2.r[1]-L2.r[0]),
          a:L2.a[0]+Math.random()*(L2.a[1]-L2.a[0]),
          p:Math.random()*TAU, spark:Math.random()<L2.spark
        });
      }
    }
  }
  // ---------------- 数据 ----------------
  async function load(){
    try{
      const r = await fetch('graph',{cache:'no-store'});
      const d = await r.json();
      nodes = (d.nodes||[]).map(n=>{
        const ang=Math.random()*TAU, rad=120+Math.random()*380;
        return Object.assign({}, n, {
          x:Math.cos(ang)*rad, y:(Math.random()-.5)*420, z:Math.sin(ang)*rad,
          vx:0,vy:0,vz:0, deg:0, phase:Math.random()*TAU,
          tint: TYPE_TINT[n.type] || TYPE_TINT.note
        });
      });
      const map = new Map(nodes.map(n=>[n.id,n]));
      links = (d.links||[]).map(l=>({...l,a:map.get(l.source),b:map.get(l.target)})).filter(l=>l.a&&l.b);
      links.forEach(l=>{ l.a.deg++; l.b.deg++; });
      boot.classList.add('gone'); setTimeout(()=>boot.remove(), 320);
    }catch(e){ boot.textContent='加载失败：'+e.message; }
  }

  // ---------------- 物理 ----------------
  const REP=4200, DAMP=.86, CENTER=.00085;
  function simulate(){
    const n=nodes.length;
    for(let i=0;i<n;i++){
      const a=nodes[i];
      for(let j=i+1;j<n;j++){
        const b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
        let d2=dx*dx+dy*dy+dz*dz;
        if(d2<1){ dx=Math.random()-.5; dy=Math.random()-.5; dz=Math.random()-.5; d2=1; }
        if(d2>1.1e6) continue;
        const boost=(a.type==='session'||b.type==='session')?1.7:1;
        const f=REP/(d2+70)*boost/Math.sqrt(d2);
        a.vx-=dx*f; a.vy-=dy*f; a.vz-=dz*f;
        b.vx+=dx*f; b.vy+=dy*f; b.vz+=dz*f;
      }
    }
    for(const l of links){
      const a=l.a,b=l.b;
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      const rest=l.kind==='session'?130:95;
      const k=.010*(.6+(l.weight||.3));
      const f=(d-rest)*k, ux=dx/d, uy=dy/d, uz=dz/d;
      a.vx+=ux*f; a.vy+=uy*f; a.vz+=uz*f;
      b.vx-=ux*f; b.vy-=uy*f; b.vz-=uz*f;
    }
    for(const p of nodes){
      p.vx-=p.x*CENTER; p.vy-=p.y*CENTER; p.vz-=p.z*CENTER;
      p.vx*=DAMP; p.vy*=DAMP; p.vz*=DAMP;
      p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
    }
  }

  // ---------------- 投影 ----------------
  let cY=1,sY=0,cP=1,sP=0;
  function prep(){ cY=Math.cos(yaw); sY=Math.sin(yaw); cP=Math.cos(pitch); sP=Math.sin(pitch); }
  function proj(p){
    const x1=p.x*cY - p.z*sY;
    const z1=p.x*sY + p.z*cY;
    const y2=p.y*cP - z1*sP;
    const z2=p.y*sP + z1*cP;
    const f=1000, persp=f/(f+z2+700);
    return {x:W/2+panX+x1*persp*zoom, y:H/2+panY+y2*persp*zoom, z:z2, s:persp};
  }

  // ---------------- 星体绘制 ----------------
  // 一条从中心向外的光针（两端锥形），angle 弧度
  function spike(x,y,angle,len,w,col,alpha){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(angle);
    const g=ctx.createLinearGradient(-len,0,len,0);
    g.addColorStop(0,rgba(col,0));
    g.addColorStop(.34,rgba(col,alpha*.30));
    g.addColorStop(.5,rgba(col,alpha));
    g.addColorStop(.66,rgba(col,alpha*.30));
    g.addColorStop(1,rgba(col,0));
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(-len,0);
    ctx.quadraticCurveTo(0,-w*.5,len,0);
    ctx.quadraticCurveTo(0, w*.5,-len,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 四芒星：核心球 + 长十字光芒 + 短斜芒 + 柔光
  function drawStar(x,y,r,tint,alpha,power){
    ctx.globalCompositeOperation='lighter';

    // 大范围柔光
    let g=ctx.createRadialGradient(x,y,0,x,y,r*11);
    g.addColorStop(0,rgba([170,215,255],.16*alpha));
    g.addColorStop(.25,rgba([120,175,255],.07*alpha));
    g.addColorStop(.6,rgba([80,140,240],.025*alpha));
    g.addColorStop(1,rgba([60,120,220],0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*11,0,TAU); ctx.fill();

    // 近场辉光（带类型色）
    g=ctx.createRadialGradient(x,y,0,x,y,r*3.4);
    g.addColorStop(0,rgba(tint,.50*alpha));
    g.addColorStop(.45,rgba(tint,.18*alpha));
    g.addColorStop(1,rgba(tint,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*3.4,0,TAU); ctx.fill();

    // 光芒
    const long = r*(6.0+power*3.6);
    const mainA = alpha*(.55+power*.35);
    spike(x,y,0, long, r*.62, tint, mainA);              // 水平
    spike(x,y,Math.PI/2, long, r*.62, tint, mainA);      // 垂直
    spike(x,y,Math.PI/4, long*.46, r*.40, tint, mainA*.55);
    spike(x,y,-Math.PI/4, long*.46, r*.40, tint, mainA*.55);

    // 白色核心
    g=ctx.createRadialGradient(x,y,0,x,y,r*1.25);
    g.addColorStop(0,`rgba(255,255,255,${.98*alpha})`);
    g.addColorStop(.35,`rgba(232,245,255,${.92*alpha})`);
    g.addColorStop(.7,rgba([190,220,255],.55*alpha));
    g.addColorStop(1,rgba(tint,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*1.25,0,TAU); ctx.fill();

    // 高光点
    ctx.fillStyle=`rgba(255,255,255,${.95*alpha})`;
    ctx.beginPath(); ctx.arc(x-r*.18,y-r*.2,r*.34,0,TAU); ctx.fill();

    ctx.globalCompositeOperation='source-over';
  }

  function matchNode(n){
    if(!filter) return false;
    return (n.label+' '+(n.desc||'')+' '+(n.type||'')).toLowerCase().includes(filter);
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(auto && !dragging) yaw+=dt*.09;
    prep();
    if(nodes.length) simulate();

    ctx.drawImage(bgCanvas,0,0);
    const t=now/1000;

    // 背景星（含小闪光）
    ctx.globalCompositeOperation='lighter';
    for(const L of starLayers){
      for(const s of L.list){
        const tw=.55+.45*Math.sin(t*L.sp+s.p);
        const a=s.a*tw;
        const sx=s.x+panX*.014, sy=s.y+panY*.014;
        ctx.fillStyle=`rgba(216,232,255,${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(sx,sy,s.r,0,TAU); ctx.fill();
        if(s.spark && tw>.75){
          const L2=s.r*7*tw;
          spike(sx,sy,0,L2,s.r*1.1,[200,225,255],a*.55);
          spike(sx,sy,Math.PI/2,L2,s.r*1.1,[200,225,255],a*.55);
        }
      }
    }

    // 连线
    for(const l of links){
      const A=proj(l.a), B=proj(l.b);
      const near=(hover&&(l.a===hover||l.b===hover))||(sel&&(l.a===sel||l.b===sel));
      let a=(l.kind==='session'?.11:.05)*(.6+(l.weight||.3))*clamp((A.s+B.s)*.5,0,1);
      if(near) a=Math.max(a,.45);
      if(filter && !(matchNode(l.a)&&matchNode(l.b))) a*=.15;
      ctx.strokeStyle=near?`rgba(180,220,255,${a})`:`rgba(120,175,255,${a})`;
      ctx.lineWidth=near?1.2:.65;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';

    // 星体（远→近）
    const order=nodes.map(n=>({n,p:proj(n)})).sort((a,b)=>a.p.z-b.p.z);
    for(const {n,p} of order){
      if(p.s<=0) continue;
      const depth=clamp(1.18-p.z/2000,.35,1.35);
      const isH=hover===n, isS=sel===n, m=matchNode(n);
      let r=Math.max(2.2, n.size*p.s*zoom*1.5);
      if(isH||isS) r*=1.25;
      const power=clamp((n.size-1)/7+(isS?1.2:isH?.7:0),0,1.6);
      const alpha=depth*(filter&&!m?.10:1);
      drawStar(p.x,p.y,r,n.tint,alpha,power);
    }

    // 标签
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    for(const {n,p} of order){
      const isH=hover===n, isS=sel===n, m=matchNode(n);
      const big=n.size>6.2 && zoom>1.0;
      if(!(isH||isS||m||big)) continue;
      const r=Math.max(2.2,n.size*p.s*zoom*1.5)*(isH||isS?1.25:1);
      ctx.font=`${isS?12.5:isH?12:11}px "PingFang SC","Microsoft YaHei",sans-serif`;
      const alpha=isS?.98:isH?.94:m?.9:.55;
      ctx.shadowColor='rgba(120,190,255,.9)'; ctx.shadowBlur=isS?16:9;
      ctx.fillStyle=`rgba(240,247,255,${alpha})`;
      ctx.fillText(n.label||'',p.x,p.y-r-11);
      ctx.shadowBlur=0;
    }

    requestAnimationFrame(frame);
  }

  function pick(x,y){
    let best=null,bd=1e9;
    for(const n of nodes){
      const p=proj(n);
      const r=Math.max(8,n.size*p.s*zoom*1.5);
      const d=Math.hypot(p.x-x,p.y-y);
      if(d<r+8&&d<bd){ best=n; bd=d; }
    }
    return best;
  }

  cv.addEventListener('mousedown',e=>{
    dragging=true; mode=e.button===2?2:1; lx=e.clientX; ly=e.clientY; moved=0;
    cv.classList.add('grabbing');
  });
  addEventListener('mouseup',()=>{ dragging=false; cv.classList.remove('grabbing'); });
  addEventListener('mousemove',e=>{
    if(dragging){
      const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
      moved+=Math.abs(dx)+Math.abs(dy);
      if(mode===1){ yaw+=dx*.0055; pitch=clamp(pitch+dy*.0055,-1.35,1.35); }
      else { panX+=dx; panY+=dy; }
      return;
    }
    hover=pick(e.clientX,e.clientY);
    if(hover){
      tip.classList.add('on'); tip.textContent=hover.label;
      tip.style.left=Math.min(W-330,e.clientX+16)+'px';
      tip.style.top=(e.clientY+18)+'px';
    } else tip.classList.remove('on');
  });
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    zoom=clamp(zoom*(e.deltaY>0?.92:1.08),.22,5);
  },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('click',e=>{
    if(moved>6) return;
    const n=pick(e.clientX,e.clientY);
    n?openNode(n):closePanel();
  });
  cv.addEventListener('dblclick',()=>{ yaw=.55;pitch=-.22;zoom=1;panX=0;panY=0; });

  document.getElementById('resetBtn').onclick=()=>{ yaw=.55;pitch=-.22;zoom=1;panX=0;panY=0; };
  q.addEventListener('input',()=>{ filter=q.value.trim().toLowerCase(); });

  async function openNode(n){
    sel=n; panel.classList.add('open');
    pTitle.textContent=n.desc?n.desc:n.label;
        pMeta.textContent='';
    const meta=(text)=>{ const s=document.createElement('span'); s.textContent=text; pMeta.appendChild(s); };
    meta(TYPE_CN[n.type]||n.type);
    const use=document.createElement('span'); use.append('被想起 ');
    const b=document.createElement('b'); b.textContent=String(n.uses);
    use.append(b,' 次'); pMeta.appendChild(use);
    meta(`${n.chars} 字`);
    if(n.updated) meta(String(n.updated).split(' ')[0]);
    pBody.textContent='…';
    if(n.type==='session'){
      pBody.textContent=n.desc||'这是一段对话的枢纽，周围的星是同一次聊天里留下来的记忆。';
      return;
    }
    try{
      const r=await fetch('node?id='+encodeURIComponent(n.id),{cache:'no-store'});
      const d=await r.json();
      pBody.textContent=d.ok?d.text:'（读取失败）';
    }catch(err){ pBody.textContent='读取失败：'+err.message; }
  }
  function closePanel(){ sel=null; panel.classList.remove('open'); }
  document.getElementById('closeBtn').onclick=closePanel;
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closePanel(); filter=''; q.value=''; }
    if(e.key===' '&&e.target!==q){ auto=!auto; e.preventDefault(); }
  });

  resize(); load(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
