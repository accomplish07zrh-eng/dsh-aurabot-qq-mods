<!doctype html>
<!-- Aurabot 桌宠渲染页（模板/生成物）：透明无边框、气泡、拖拽 + 甩抛（physics.js）、webm 动画池。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; user-select: none; }
  /* 舞台：动画 / 静态形象都在这里，整块可拖拽（拖拽不用 -webkit-app-region，那样会吞掉指针事件，
     JS 拖拽才能采到轨迹算甩抛初速，见 physics.js）。
     高度 360：素材是 640×360（16:9）。人物基准高约 268px，抬手/跳跃这类伸展帧能到 319px。
     舞台原来只有 240 高 → 伸展帧顶出框被 overflow 切掉（用户反馈「动画没完整显示」）。
     360 是按「人物接近原大 + 伸展帧 322 也装得下」定的，人物不再被缩小。 */
  #stage {
    position: absolute; left: 20px; bottom: 16px; width: 240px; height: 360px;
    cursor: grab; touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  /* 静态形象（没有任何动画素材时的兜底） */
  #pet {
    position: absolute; right: 24px; bottom: 8px; width: 96px; height: 96px;
    border-radius: 50%; background: rgba(60, 170, 220, .85);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; transition: transform .2s;
    transform-origin: 50% 100%;
  }
  #pet.mood-very-happy { transform: scale(1.12) rotate(-6deg); }
  #pet.mood-happy { transform: scale(1.05); }
  #pet.mood-neutral { transform: none; }
  #pet.mood-low { transform: scale(.94); filter: saturate(.7); }
  #pet.mood-sad { transform: scale(.88) rotate(4deg); filter: saturate(.4) brightness(.9); }
  /* webm 动画层（P1）：素材就绪时盖住静态形象。默认按 240 宽渲染（640×360 素材 → 135 高），
     首帧后由 applyStageCrop 放大平移，让人物填满舞台（行内 width/height/left/bottom 会覆盖这里） */
  #anim { position: absolute; left: 0; bottom: 0; width: 240px; display: none; }
  #anim.squashing { transform-origin: 50% 100%; }
  /* A/B 双缓冲：两只都绝对定位叠在一起，只有 .is-front 那只可见。
     换源时新的那只先在后台加载，loadeddata 后才翻上来——旧的那只那一刻才隐藏，不会闪。 */
  .anim-slot {
    position: absolute; left: 0; bottom: 0; width: 240px;
    display: none; opacity: 0; transition: none;
  }
  .anim-slot.is-front { display: block; opacity: 1; }
  .anim-slot.squashing { transform-origin: 50% 100%; }
  /* 气泡：锚在宠物头顶（人物头顶≈舞台上沿，即窗口底往上 16+360=376px），向上生长、中心对齐。
     窗口高随内容伸缩：气泡收起 384，弹出时主进程按气泡实高向上长。 */
  #bubble {
    position: absolute; left: 20px; bottom: 388px; width: 240px; box-sizing: border-box;
    background: rgba(255, 255, 255, .97); border: 1px solid #bcd9ea; border-radius: 12px;
    padding: 9px 12px; font-size: 12.5px; line-height: 1.55; color: #234;
    box-shadow: 0 6px 18px rgba(30, 80, 120, .22); display: none; cursor: default;
    word-break: break-word; transform-origin: 50% 100%;
  }
  #bubble.show { display: block; animation: bubbleIn .14s ease-out; }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(5px) scale(.97); } to { opacity: 1; transform: none; } }
  /* 顶部角落模式（body.at-top）：气泡改成往下长、小尾巴朝上。
     出生点在左上/右上时，人贴屏幕上沿，气泡再往上长就会顶出屏幕——见 applyCorner。 */
  body.at-top #stage { top: 8px; bottom: auto; }
  body.at-top #bubble { top: 388px; bottom: auto; transform-origin: 50% 0; }
  body.at-top #bubble.show { animation: bubbleInTop .14s ease-out; }
  @keyframes bubbleInTop { from { opacity: 0; transform: translateY(-5px) scale(.97); } to { opacity: 1; transform: none; } }
  body.at-top #bubble::after { bottom: auto; top: -5px; border-right: none; border-bottom: none; border-left: 1px solid #bcd9ea; border-top: 1px solid #bcd9ea; }
  #bubble::after { /* 指向宠物头顶的小尾巴 */
    content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px;
    background: rgba(255, 255, 255, .97); border-right: 1px solid #bcd9ea; border-bottom: 1px solid #bcd9ea;
    transform: translateX(-50%) rotate(45deg);
  }
  #bubble .tag { display: inline-block; font-size: 10px; color: #2a86c6; margin-bottom: 3px; }
  /* 长文本最多 6 行：窗口高 430，气泡区只有 ~154px，再高会顶出窗口被裁掉 */
  #bubbleText { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
</style>
</head>
<body>
  <div id="bubble"><div class="tag" id="bubbleTag">主动来找你</div><div id="bubbleText"></div></div>
  <div id="stage">
    <!-- 静态形象的**兜底**：只有素材表为空 / 全部素材加载失败时才出现（见 stopVideo）。
         正常情况下静止时显示的是「待机动画的末帧」= 鲸鱼娘本人，不是这个 emoji。
         初始先藏起来，免得素材表到达前的几百毫秒里闪一下蓝色圆圈。 -->
    <div id="pet" class="mood-neutral" style="display:none">🐳</div>
    <!-- A/B 双缓冲（从 dsh-pet 的 animation.ts 搬来）：新动画先加载到**隐藏的那只**，
         等 loadeddata 就绪才翻到前台。单只 video 换源会先黑一帧、且重播同段要 currentTime=0
         硬跳回首帧——那正是「每两秒闪一下」的根源。两只轮流用就永远看不到这一步。 -->
    <video id="animA" class="anim-slot" autoplay muted playsinline></video>
    <video id="animB" class="anim-slot" autoplay muted playsinline></video>
  </div>
<script src="physics.js"></script>
<script>
  const bubble = document.getElementById('bubble')
  const bubbleTag = document.getElementById('bubbleTag')
  const bubbleText = document.getElementById('bubbleText')
  const pet = document.getElementById('pet')
  const stage = document.getElementById('stage')
  // A/B 双缓冲：vidA/vidB 轮流用，只有 .is-front 那只可见。
  // `video` 始终指向**当前前台**那只——其余代码（裁切、挤压、诊断）都只关心前台，不用改。
  const vidA = document.getElementById('animA')
  const vidB = document.getElementById('animB')
  let frontIsA = true
  let video = vidA
  /** 当前后台那只（下一次换源写它）。 */
  const backVideo = () => (frontIsA ? vidB : vidA)
  // 换源代次（dsh-pet 的 swapGen）：每次真正开始换源 +1，loadeddata 回来时比对，
  // 对不上说明已被更新的切换顶掉。光比动画名不够——轮换绕回同一段时名字相同，分不出新旧。
  let playGen = 0
  // 冻结标志（dsh-pet 的 applyFreeze）：冻结时动画链不推进。
  // 必须在这里提前声明——afterAnim 会读它，而 afterAnim 在文件更早的位置被定义调用。
  let frozen = false
  // 正在切的那一段（防重 + 代次）。null = 没有挂起的换源。
  let pendingSwap = null
  let pendingSwapOnce = null
  const P = window.PetPhysics

  // ---------- 素材裁边（修「桌宠上方空白区域过大」）----------
  // 实测：素材真实规格是 **640×360（16:9）**，人物只画在画面中下部约 222×268 的框里，
  // 四周全透明（早先注释写「1:1 方形 240×240」是错的，导致舞台/窗口按 240 高留白）。
  // 做法：拿到首帧后扫一遍像素求人物包围盒，再把 <video> 放大平移，让人物刚好填满舞台——
  // 底边贴舞台底（脚踩地面）、水平居中。舞台仍是 240×240，拖拽/物理/命中都不用改。
  // 39 段动画包围盒几乎一致（y 63~330），所以一次性裁切安全；换包时重算。
  let cropDone = false
  let cropRetry = 0    // detectCharBox 拿不到帧时的重试次数（见 applyStageCrop）
  let cropK = 1        // 最近一次裁切用的缩放倍率（诊断用，见 __cropInfo）
  let cropBox = null   // 最近一次量到的人物包围盒
  /** 把裁切样式同时写到两只 video 上。
   *  A/B 双缓冲下必须两只都套同一套几何：新那只是「已经加载好、马上要翻到前台」的，
   *  它若还带着未裁切的原尺寸，翻上来的那一帧人物会突然变大一下——又是一次闪。 */
  const applyCropStyle = (w, h, left, bottom) => {
    for (const el of [vidA, vidB]) {
      el.style.width = w
      el.style.height = h
      el.style.left = left
      el.style.bottom = bottom
    }
  }
  const clearCropStyle = () => { applyCropStyle('', '', '', '') }
  function detectCharBox(el) {
    const v = el || video
    try {
      const vw = v.videoWidth, vh = v.videoHeight
      if (!vw || !vh || v.readyState < 2) return null
      const cv = document.createElement('canvas')
      cv.width = vw; cv.height = vh
      const ctx = cv.getContext('2d', { willReadFrequently: true })
      ctx.drawImage(v, 0, 0, vw, vh)
      const d = ctx.getImageData(0, 0, vw, vh).data
      let x0 = vw, y0 = vh, x1 = -1, y1 = -1
      for (let y = 0; y < vh; y++) {
        for (let x = 0; x < vw; x++) {
          const i = (y * vw + x) * 4
          // 透明区正常 alpha=0；个别平台 canvas 拿不到 alpha 会退化成纯黑，两种都当背景
          if (d[i + 3] > 8 && d[i] + d[i + 1] + d[i + 2] > 24) {
            if (x < x0) x0 = x
            if (x > x1) x1 = x
            if (y < y0) y0 = y
            if (y > y1) y1 = y
          }
        }
      }
      if (x1 < 0) return null
      return { x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1, vw, vh }
    } catch { return null } // 画布被污染等：不裁，保持原样（宁可空白也别出错）
  }
  function applyStageCrop() {
    if (cropDone) return
    const bb = detectCharBox()
    // detectCharBox 在 readyState<2 时返回 null：原来只在 loadeddata 触发一次，
    // 那一次若还没 ready 裁切就永久不做 → 人物按原尺寸塞进小舞台，被切掉一截。
    // 现在失败会重试几次（见下方多处事件与 timeupdate）。
    if (!bb) {
      if (cropRetry < 20) { cropRetry++; setTimeout(applyStageCrop, 120) }
      return
    }
    cropRetry = 0
    const STAGE_W = 240, STAGE_H = 360 // 与 CSS #stage 一致（高度提到 360 以装下伸展帧）
    // 尺度不能按「这一帧」定：同一段素材不同帧的高度差能到 ~20%（实测 267→319），
    // 按当帧定尺度的话，伸展帧就会顶出舞台被 overflow 切掉——「动画没完整显示」正是这个。
    // 素材固定 640×360、人物总画在同一基准区域，所以按**基准人形**定尺度才稳定；
    // 再用「最伸展的帧也不溢出」和「宽度不溢出」两道封顶兜住极端情况。
    const CHAR_BASE_H = 268 // 640×360 素材里人物基准高（109 段实测 266~267）
    const CHAR_MAX_H = 322  // 实测最大伸展高 319，留一点余量
    const baseH = Math.max(bb.h, CHAR_BASE_H)
    const kW = STAGE_W / Math.max(bb.w, 220)   // 宽方向不能溢出（实测最宽约 220）
    const kBase = STAGE_H / 330                // 基准态：人物接近满格（268×1.09≈292）
    const k = Math.min(STAGE_H / CHAR_MAX_H, kW, kBase)
    if (k <= (240 / bb.vw) * 1.08) { cropDone = true; cropK = 1; return } // 素材本来就满格：别白折腾
    cropK = k
    cropBox = { x0: bb.x0, y0: bb.y0, w: bb.w, h: bb.h, vw: bb.vw, vh: bb.vh }
    // 底边对齐：用「基准人形」的脚底（y0+基准高）贴舞台底，而不是这一帧的底边，
    // 否则伸展帧会把整幅画往上顶，静止时脚下又空一截。
    applyCropStyle(
      (bb.vw * k) + 'px',
      (bb.vh * k) + 'px',
      (STAGE_W / 2 - (bb.x0 + bb.w / 2) * k) + 'px',
      (-(bb.vh - (bb.y0 + baseH)) * k) + 'px',
    )
    cropDone = true
  }
  function resetStageCrop() {
    cropDone = false
    cropRetry = 0
    clearCropStyle()
  }
  // loadeddata 可能来得太早（readyState 还没到 2）、也可能换了 src 才来：
  // 多挂几个时机，任何一个能把框量出来就把裁切定下来。两只都要挂。
  for (const el of [vidA, vidB]) {
    el.addEventListener('loadeddata', applyStageCrop)
    el.addEventListener('canplay', applyStageCrop)
    el.addEventListener('playing', applyStageCrop)
    el.addEventListener('timeupdate', () => { if (!cropDone) applyStageCrop() })
  }


  // ---------- 形象包（P1/P4）：动画池 + 权重 + 物理参数；缺素材回静态形象 ----------
  let packAnims = {}   // 动画名 → 带 token 的素材地址（主进程给）
  let pools = { idle: [], speak: [], click: [] }
  let weights = {}
  let physicsParams = null
  let workMap = {}     // 干活状态 → 动画 id（服务端按命名约定/包配置解析好）
  let memeUrls = {}    // 梗图名 → 带 token 的图片地址（主进程给，和 anims 同一套）
  window.__setPack = (p) => {
    packAnims = p && p.anims ? p.anims : {}
    memeUrls = p && p.memes ? p.memes : {}
    resetStageCrop() // 换包：上一份素材的裁切量不能套到新素材上，等首帧重新量
    coolDown = {} // 主进程重推素材表（重连/换包）：冷却全部清零，从干净状态开始
    // src 缓存标记一并清掉：换包后同名动画指向的地址可能变了（带新 token），
    // 留着旧标记会让 playAnim 误判「src 没变、不用重设」，结果播的还是上一份素材。
    for (const el of [vidA, vidB]) el.removeAttribute('data-src')
    pendingSwap = null
    pendingSwapOnce = null
    pools = (p && p.pools) || { idle: [], speak: [], click: [] }
    weights = (p && p.weights) || {}
    physicsParams = (p && p.physics) || null
    workMap = (p && p.workStatus) || {}
    applyFont(p) // 自定义字体/字号：素材表到了才知道
    applyCorner(p && p.atTop === true) // 出生点在上沿还是下沿：决定气泡往哪边长
    if (!hasAnims()) stopVideo()
    else if (!currentAnim) playStill() // 首次拿到素材表：先摆一个待机立绘（别露 emoji）
    scheduleIdle()
  }
  /** 只翻上沿/下沿布局（主进程改出生点时单独推，避免重推整份素材表导致动画重播=闪烁）。 */
  window.__setCorner = (isTop) => { applyCorner(isTop === true) }
  const hasAnims = () => Object.keys(packAnims).length > 0

  // ---------- 动画播放（权重随机，播完回静态/接 idle；出错/缺素材回静态形象，不报错） ----------
  // currentKind：'idle' | 'speak' | 'click' | 'menu'，'' = 没在播。
  // 历史 bug：点播播完靠 scheduleIdle 接力，但它只在 !currentAnim 时才起 idle，
  // 而 currentAnim 播完并不清空 → 点一次菜单动画就永远停在最后一帧。
  // 现在的规矩：**播完一律走 afterAnim**——autoIdle 开着才接 idle，否则回静态立绘。
  // （以前是「播完直接接 playIdle，idle 首尾相接」，等于桌宠自己在轮播动画，会和 AI 行为动作抢台。）
  let currentAnim = ''
  let currentKind = ''
  // 自动轮播开关（2026-10-30 关掉）：以前 playIdle 首尾相接、永不停，AI 行为动作播到一半
  // 就被 idle 接力切走，看起来像「动作没执行」。现在默认**不自动播**，只在
  //   ① AI 行为动作点播（playAnimByName / __playIdleOnce）
  //   ② 说话气泡（speak 池）
  //   ③ 用户点击（click 池）
  // 时播一段，播完回静态立绘。要恢复老行为：window.__setAutoIdle(true)。
  let autoIdle = false
  // 空闲轮换（2026-11-05 加）：修「平时不轮换动作、一直发呆」。
  // 和 autoIdle 的区别：autoIdle 是**首尾相接**地一直播（所以才会抢台，2026-10-30 才关掉）；
  // idleLoop 是「播完歇 4~9 秒再播下一段」——有留白，看着自然，而且
  // 任何点播（AI 动作 / 说话 / 点击 / 工作档位）都会先 stopIdleLoop() 让位，
  // 从根上避免抢台。要关掉：window.__setIdleLoop(false)。
  // 空闲轮换（2026-11-05）：空闲时也轮换待机动作，但比工作档位慢。
  // 与 autoIdle 的区别：autoIdle 是「首尾相接地一直播」（会抢台），
  // idleLoop 是「播完隔几秒再播下一段」，中间留白，且任何点播都会立刻让位。
  let idleLoopOn = true
  let idleGapMinMs = 4000   // 两段待机之间的最短留白
  let idleGapMaxMs = 9000   // 最长留白（随机取，免得看起来像节拍器）
  // 素材故障冷却（修「不定时变鲸鱼」）：加载连续失败只临时跳过 5 分钟，不再永久摘除——
  // DSH 重启窗口期、端口漂移、GPU 解码 hiccup 都是暂时性的，摘除了就永远播不回来。
  let coolDown = {}   // 动画名 → 冷却到期时间戳；到期后 pickFrom 自动恢复可选
  let failStreak = 0  // 连续「起播即失败」次数：服务器全挂时避免紧密重试循环
  const COOL_MS = 5 * 60_000
  const FAIL_STREAK_MAX = 3
  function pickFrom(poolName) {
    const now = Date.now()
    const pool = (pools[poolName] || []).filter((n) => packAnims[n] && !(coolDown[n] && now < coolDown[n]))
    if (!pool.length) return ''
    const w = pool.map((n) => Math.max(0, Number(weights[poolName]) || 1))
    const total = w.reduce((a, b) => a + b, 0)
    if (!(total > 0)) return pool[Math.floor(Math.random() * pool.length)]
    let r = Math.random() * total
    for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i] }
    return pool[pool.length - 1]
  }
  function stopVideo() {
    for (const el of [vidA, vidB]) {
      try { el.pause() } catch {}
      el.classList.remove('is-front')
      el.removeAttribute('src')
      el.removeAttribute('data-src')
      delete el.dataset.anim
    }
    // 挂起的换源一并作废：否则之后同名的 playAnim 会撞上防重直接返回，永远不播
    pendingSwap = null
    pendingSwapOnce = null
    pet.style.display = 'flex'
    currentAnim = ''
    currentKind = ''
  }
  /** 一段动画播完之后去哪。
   *  2026-10-30 修：以前这里 `stopVideo()` 会藏掉 video、露出 #pet 那个 🐳 emoji 圆圈，
   *  看起来像「桌宠变成了一个蓝色圆图标」。素材包里没有 png 立绘，所以静态形象的正确做法是
   *  让待机动画停在自己的最后一帧 —— 浏览器会保留这一帧画面，就是鲸鱼娘本人。
   *  emoji 只在「素材表为空 / 全部素材加载失败」时兜底（stopVideo 仍保留那条路）。
   *  2026-11-05 修「一直发呆」：旧逻辑播完一段 idle 就定格，空闲时永远不动。
   *  现在改成**空闲也轮换**（idleLoop），但比工作档位慢得多（idleGapMs），
   *  且任何点播（AI 动作 / 说话 / 点击）都会通过 stopIdleLoop 立刻让位。 */
  function afterAnim() {
    if (frozen) return // 冻结中：不推进动画链，画面定格
    if (idleLoopOn) {

      // 会永远把它挡回去，桌宠就还是定格发呆（第一版就踩了这个坑）。
      currentAnim = ''
      currentKind = 'still'
      scheduleIdle()
      return

  function isIdleFrame(name) {
    return Boolean(name) && (pools.idle || []).includes(name) && (vidA.classList.contains('is-front') || vidB.classList.contains('is-front'))
  }
  /** 摆静态立绘：播一段待机动画，播完停在末帧（不循环、不接下一段）。

  function playAnim(name, onEnd, kind) {

    const el = backVideo()

    if (el.getAttribute('data-src') !== url) {

    // 以前这里只比 dataset.anim，而 dataset.anim 刚被写上，等于永远命中 →

    if (el.readyState >= 2 && el.getAttribute('data-src') === url) {

  let idleTimer = null

  }

  let bubbleTimer = null
  // 自定义字体（从 dsh-pet 搬来）：字体种类/字号走 pack.fontStyle（对应 dsh-pet 的 FONT_PRESETS）
  const FONT_STACKS = {
    candy: '"PetCustom","ShangshouSoftCandy","Yuanti SC","YouYuan","幼圆","Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif',
    yahei: '"Microsoft YaHei","PingFang SC",sans-serif',
    youyuan: '"YouYuan","Yuanti SC",sans-serif',
    kaiti: '"KaiTi","STKaiti",serif',
    simsun: '"SimSun","Songti SC",serif',
    comic: '"Comic Sans MS","Comic Sans",cursive',
    system: 'system-ui,sans-serif',
  }
  let fontAppliedKey = ''
  function applyFont(packInfo) {
    const url = memeUrls.__font
    const fs = (packInfo && packInfo.fontStyle) || null
    if (!fs && !url) return
    const family = (fs && fs.family) || 'candy'
    const size = (fs && fs.size) || 21
    const key = `${family}|${size}|${url ? 1 : 0}`
    if (key === fontAppliedKey) return
    fontAppliedKey = key
    try {
      const stack = FONT_STACKS[family] || FONT_STACKS.candy
      const face = url ? `@font-face{font-family:'PetCustom';src:url('${url}');font-display:swap}` : ''
      const style = document.createElement('style')
      style.id = 'petFontStyle'
      style.textContent = `${face}
body,#bubbleText,#bubbleTag{font-family:${stack}}
#bubbleText{font-size:${size}px}
#bubbleTag{font-size:${Math.max(9, Math.round(size * 0.48))}px}`

  function splitMeme(text) {
    const m = String(text || '').match(/\[图[:：]\s*([^\]\n]+?)\s*\]\s*$/)
    if (!m) return { text: String(text || ''), meme: '' }
    return { text: String(text || '').slice(0, m.index).trim(), meme: m[1] }
  }

    const url = memeUrls[name]
    if (!url) return false
    let img = document.getElementById('bubbleMeme')
    if (!img) {
      img = document.createElement('img')
      img.id = 'bubbleMeme'
      img.style.cssText = 'max-width:180px;max-height:180px;border-radius:10px;display:block;margin-top:4px'

    img.onerror = () => { img.style.display = 'none'; requestAnimationFrame(refitWindow) }

    if (img) { img.style.display = 'none'; img.removeAttribute('src') }
  }
  window.__bubble = (t, mood, secs, anim, playbackId, tag, emo) => {
    const { text: plain, meme } = splitMeme(t)
    bubbleText.textContent = plain
    bubbleText.style.display = plain ? '' : 'none'
    if (meme) showMeme(meme)
    else hideMeme()
    bubbleTag.textContent = String(tag || '主动来找你')
    bubble.classList.add('show')
    pet.className = 'mood-' + (mood || 'neutral')
    // 情绪画像 → 气泡辉光：冷暖色随 valence（正=暖金 / 负=冷蓝），强弱随 arousal（幅度+亮度）。
    // 没带画像（老插件/非目的回合）就清掉，回到默认描边。
    if (emo && typeof emo === 'object' && Number.isFinite(Number(emo.arousal))) {
      const val = Number.isFinite(Number(emo.valence)) ? Number(emo.valence) : 0
      const glow = Math.max(0, Math.min(1, Number(emo.arousal)))
      const hue = val >= 0 ? 45 : 205
      bubble.style.boxShadow = `0 0 ${Math.round(8 + glow * 18)}px hsla(${hue},80%,60%,${(0.25 + glow * 0.35).toFixed(2)})`

    const name = (anim && packAnims[anim]) ? anim : pickFrom('speak')
    const played = (anim && playbackId && packAnims[anim]) ? { anim, playbackId } : null
    if (name) { stopIdleLoop(); playAnim(name, null, 'speak') } // 说话：空闲轮换让位，别抢台词动作
    return played
  }

    bubbleText.style.display = ''

    refitWindow() // 气泡收起：窗口缩回贴合宠物本体（见下方 refitWindow）
    syncInputRegions() // 控件矩形随之清空
  }

  }

    const onStage = (vidA.classList.contains('is-front') ? vidA : vidB.classList.contains('is-front') ? vidB : null)
    const target = onStage || pet
    const token = ++squashToken
    target.classList.add('squashing')
    const t0 = performance.now()
    const tick = (now) => {

  let clickAudio = null

  }
  // 右键「动作」子菜单点播：任意已知动画强制插播，播完接回 idle（绝不留在最后一帧）

      return
    }
    // M：按住说话（松开发送）
    if (k === 'm' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault()
      window.petBridge && window.petBridge.hotkey && window.petBridge.hotkey('hear-start')
    }
  })
  document.addEventListener('keyup', (e) => {
    const tag = (e.target && e.target.tagName) || ''
    if (tag === 'INPUT' || tag === 'TEXTAREA') return
    if (String(e.key || '').toLowerCase() === 'm') {
      window.petBridge && window.petBridge.hotkey && window.petBridge.hotkey('hear-stop')
    }
  })
  /** 供命中检测更新 hoverBody（与穿透判定同源）。 */
  window.__setHoverBody = (v) => { hoverBody = !!v }

  /** 上报控件矩形（dsh-pet 的 syncInputRegions）：气泡这类浮层长在窗口余量区，
   *  光标离开身体就穿透、点不到。把它的矩形报给主进程，busy 期间那里也算可交互。 */
  function syncInputRegions() {
    if (!window.petBridge || !window.petBridge.setInputRegions) return
    const rects = []
    if (bubble && bubble.classList.contains('show')) {
      const r = bubble.getBoundingClientRect()
      if (r.width > 0 && r.height > 0) rects.push({ x: r.x, y: r.y, width: r.width, height: r.height })
    }
    window.petBridge.setInputRegions({ dragging: !!dragging, rects })
  }

  // ---------- 鼠标穿透：窗口只有悬停在宠物/气泡上时才拦鼠标，其余透明区域放行点击 ----------
  // 配合主进程 setIgnoreMouseEvents(true, {forward:true})：forward 让渲染页仍能收到 mousemove，
  // 这里据此做命中检测，悬停在宠物/气泡上就恢复交互，离开再放行。
  let hitState = null
  // 命中统计：查「拖不动」用。记录最近若干次 elementFromPoint 的结果。
  window.__hitStats = { calls: 0, hits: 0, misses: 0, lastEl: '', lastHit: null, samples: [] }
  // 播放统计：查「闪烁」用。记录最近 40 次动画切换（闪 = 内容反复重播，窗口尺寸看不出来）。
  window.__playStats = { switches: [], total: 0 }
  function notePlaySwitch(name, kind) {
    const st = window.__playStats
    st.total++
    st.switches.push({ t: Date.now(), name: String(name || ''), kind: String(kind || '') })
    if (st.switches.length > 40) st.switches.shift()
  }
  /** 诊断：渲染页「翻布局」和「重播动画」的次数，区分是窗口在动还是画面在重播 */
  window.__flickInfo = () => {
    const st = window.__playStats
    const now = Date.now()
    const recent = st.switches.filter((s) => now - s.t < 60000)
    // 同一段动画在短时间内被反复从头播 = 典型闪烁
    const counts = {}
    for (const s of recent) counts[s.name] = (counts[s.name] || 0) + 1
    const repeats = Object.entries(counts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1])
    return {
      totalSwitches: st.total,
      lastMinute: recent.length,
      repeatPlayed: repeats.slice(0, 5), // [名字, 次数]：>1 就是同段重播
      last5: st.switches.slice(-5).map((s) => s.name + '/' + s.kind),
      cropDone,
      cropK,
      refits: window.__refitCount || 0,
    }
  }
  function updateHit(x, y) {
    const el = document.elementFromPoint(x, y)
    const inStage = !!(el && stage.contains(el))
    const inBubble = !!(el && bubble.contains(el))
    const hit = inStage || inBubble
    // 热键只在「光标在人物身体上」时生效（dsh-pet 的 hoverBody 同源判定），
    // 用 inStage 而不是 inBubble：气泡上按键不该触发动作。
    hoverBody = inStage
    const st = window.__hitStats
    st.calls++
    if (hit) st.hits++; else st.misses++
    st.lastEl = el ? (el.id || el.tagName) : 'null'
    st.lastHit = hit
    if (st.samples.length < 40) st.samples.push({ x: Math.round(x), y: Math.round(y), el: el ? (el.id || el.tagName) : 'null', inStage, inBubble })
    if (hit !== hitState) { hitState = hit; window.petBridge && window.petBridge.setHit(hit) }
    return hit
  }
  /** 诊断：给定窗口内坐标，报出命中的元素（判断「点不中」是 DOM 问题还是坐标问题） */
  window.__probeHit = (x, y) => {
    const el = document.elementFromPoint(x, y)
    return {
      x, y,
      el: el ? (el.id || el.tagName) : 'null',
      inStage: !!(el && stage.contains(el)),
      inBubble: !!(el && bubble.contains(el)),
      hitState,
      stageRect: (() => { const r = stage.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height } })(),
      videoRect: (() => { const r = video.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height } })(),
      videoDisplay: getComputedStyle(video).display,
      bodyOverflow: getComputedStyle(document.body).overflow,
    }
  }
  document.addEventListener('mousemove', (e) => {
    // 拖拽中必须继续上报「可交互」，否则主进程兜底轮询会按光标与窗口的帧级错位
    // 把窗口翻回穿透 → pointermove/pointerup 当场断掉（dsh-pet 的 input.js 同款处理）。
    if (dragging) {
      if (window.petBridge && window.petBridge.setHit) window.petBridge.setHit(true)
      if (window.petBridge && window.petBridge.setBusy) window.petBridge.setBusy(true)
      // 按键已经全松开：说明 pointerup/pointercancel/lostpointercapture 全丢了。
      // 就地按松手收尾，否则 dragging 永久为真，穿透再也恢复不了（桌面被一整块挡死）。
      if (e.buttons === 0) {
        const d = dragging
        stopDragFollow()
        dragging = null
        stage.classList.remove('dragging')
        if (window.petBridge && window.petBridge.setBusy) window.petBridge.setBusy(false)
        if (d && d.trail && d.trail.length) {
          const p0 = d.trail[0]
          const moved = Math.hypot(e.clientX - p0.x, e.clientY - p0.y)
          if (moved >= 6) { try { drop() } catch {} }
        }
      }
      return
    }
    updateHit(e.clientX, e.clientY)
  })

  // ---------- 兜底：素材表迟迟没来（插件离线 / 端口未就绪）才露 emoji，别让窗口一直空着 ----------
  // 正常情况下 __setPack 一到就 playStill()，这里只是「1.5 秒还没有任何素材」时的保命显示。
  setTimeout(() => {
    if (!hasAnims() && !currentAnim) pet.style.display = 'flex'
  }, 1500)
  // 开局先收一次窗口：窗口模板是 430 高，渲染页就绪后没有气泡就该缩到贴合宠物本体
  refitWindow()
</script>
</body>
</html>
